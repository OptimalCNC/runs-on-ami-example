name: Qualify one Cobalt image

on:
  workflow_call:
    inputs:
      variant:
        type: string
        required: true
      job_prefix:
        type: string
        required: true
      retain:
        type: boolean
        required: true
      fault:
        type: string
        required: true

permissions:
  contents: read

jobs:
  configure:
    if: vars.AMI_EXAMPLE_CLOUD_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: configure
    runs-on: ubuntu-24.04
    outputs:
      build_id: ${{ steps.config.outputs.build_id }}
      controller_label: ${{ steps.config.outputs.controller_label }}
      region: ${{ steps.config.outputs.region }}
      role_arn: ${{ steps.config.outputs.role_arn }}
      environment: ${{ steps.config.outputs.environment }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: config
        run: |
          python3 scripts/image-config.py --build-id "$BUILD_ID" --output artifacts/config.json
          jq -r 'to_entries[] | "\(.key)=\(.value)"' artifacts/config.json >> "$GITHUB_OUTPUT"
        env:
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.variant }}

  register:
    needs: configure
    runs-on: ubuntu-24.04
    environment: ${{ needs.configure.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          python3 scripts/install-tools.py --group cloud
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
          echo "PACKER_PLUGIN_PATH=$GITHUB_WORKSPACE/.tools/plugins" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-session-name: ami-example-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ needs.configure.outputs.role_arn }}
          aws-region: ${{ needs.configure.outputs.region }}
      - run: |
          mkdir -p artifacts
          jq -n --arg prefix "$JOB_PREFIX" --arg variant "$VARIANT" '
            {configure: {name: ($prefix + "configure")},
             build: {name: ($prefix + "build"), needs: ["configure"]}} +
            (if $variant == "stock" then {} else
             {probe: {name: ($prefix + "probe")},
              "smoke-a": {name: ($prefix + "smoke-a"), needs: ["probe"], adopt: true},
              "smoke-b": {name: ($prefix + "smoke-b"), needs: ["smoke-a"], adopt: true}} end)
          ' > artifacts/job-plan.json
          terminal=smoke-b
          if [[ "$VARIANT" == stock ]]; then terminal=build; fi
          test "$BUILD_ID" = "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${BUILD_ID##*-}"
          python3 scripts/watchdog.py register --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --build-id "$BUILD_ID" --plan artifacts/job-plan.json \
            --terminal "$terminal" --deadline-seconds "$(jq .deadlines.workflow_seconds infra/deployment.json)" \
            --registration-seconds "$(jq .deadlines.registration_seconds infra/deployment.json)" --output artifacts/execution.json
        env:
          BUILD_ID: ${{ needs.configure.outputs.build_id }}
          VARIANT: ${{ inputs.variant }}
          JOB_PREFIX: ${{ inputs.job_prefix }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.configure.outputs.build_id }}-execution
          path: artifacts/execution.json
          if-no-files-found: error

  build:
    name: build
    needs: [configure, register]
    runs-on: ${{ needs.configure.outputs.controller_label }}
    environment: ${{ needs.configure.outputs.environment }}
    timeout-minutes: 105
    permissions:
      contents: read
      id-token: write
    outputs:
      ami_id: ${{ steps.build.outputs.ami_id }}
      recipe_id: ${{ steps.build.outputs.recipe_id }}
      kernel_release: ${{ steps.build.outputs.kernel_release }}
      label_a: ${{ steps.build.outputs.label_a }}
      label_b: ${{ steps.build.outputs.label_b }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          python3 scripts/install-tools.py --group build
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
          echo "PACKER_PLUGIN_PATH=$GITHUB_WORKSPACE/.tools/plugins" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-session-name: ami-example-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ needs.configure.outputs.role_arn }}
          aws-region: ${{ needs.configure.outputs.region }}
          role-duration-seconds: 14400
      - id: build
        run: |
          args=(--build-id "$BUILD_ID" --execute --config-output artifacts/config.json)
          if [[ "$RETAIN" == true ]]; then args+=(--retain); fi
          test "$BUILD_ID" = "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${BUILD_ID##*-}"
          python3 scripts/build-image.py "${args[@]}"
          jq -r 'to_entries[] | "\(.key)=\(.value)"' artifacts/config.json >> "$GITHUB_OUTPUT"
        env:
          RETAIN: ${{ inputs.retain }}
          BUILD_ID: ${{ needs.configure.outputs.build_id }}
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.configure.outputs.build_id }}-build
          path: |
            artifacts/${{ needs.configure.outputs.build_id }}
            !artifacts/**/inputs.tar
          retention-days: 14
          if-no-files-found: warn

  probe:
    name: probe
    if: inputs.variant != 'stock'
    needs: [configure, build]
    runs-on: ubuntu-24.04
    environment: ${{ needs.configure.outputs.environment }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.configure.outputs.build_id }}-build
          path: artifacts/${{ needs.configure.outputs.build_id }}
      - run: |
          python3 scripts/install-tools.py --group cloud
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
          echo "PACKER_PLUGIN_PATH=$GITHUB_WORKSPACE/.tools/plugins" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-session-name: ami-example-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ needs.configure.outputs.role_arn }}
          aws-region: ${{ needs.configure.outputs.region }}
      - run: |
          args=(--result "artifacts/$BUILD_ID/image-result.json" --build-id "$BUILD_ID" --execute)
          if [[ "$FAULT" == probe-identity ]]; then args+=(--fault); fi
          test "$BUILD_ID" = "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${BUILD_ID##*-}"
          python3 scripts/probe-ami.py "${args[@]}"
        env:
          BUILD_ID: ${{ needs.configure.outputs.build_id }}
          FAULT: ${{ inputs.fault }}
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.configure.outputs.build_id }}-probe
          path: artifacts/${{ needs.configure.outputs.build_id }}/probe
          retention-days: 14
          if-no-files-found: warn

  smoke-a:
    name: smoke-a
    needs: [configure, build, probe]
    runs-on: ${{ needs.build.outputs.label_a }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      EXPECTED_KERNEL_RELEASE: ${{ needs.build.outputs.kernel_release }}
      EXPECTED_RECIPE_ID: ${{ needs.build.outputs.recipe_id }}
      BUILD_ID: ${{ needs.configure.outputs.build_id }}
      SMOKE_STAGE: a
    steps:
      - name: Grant the runner access to Cobalt memory devices
        run: |
          test "$(id -u)" -ne 0
          [[ " $(id -G) " == *" 4242 "* ]]
          prlimit --pid "$$" --memlock --rtprio
          devices=(/dev/rtdm/memdev-private /dev/rtdm/memdev-shared)
          for device in "${devices[@]}"; do
            [[ -c "$device" && ! -L "$device" ]]
          done
          sudo chgrp xenomai "${devices[@]}"
          sudo chmod 0660 "${devices[@]}"
          stat -c '%n %U:%G %a' "${devices[@]}"
      - name: Check running Cobalt kernel and fresh image before checkout
        run: |
          mkdir -p "$RUNNER_TEMP/ami-example-smoke"
          ami-example-guest-report --release "$EXPECTED_KERNEL_RELEASE" --recipe "$EXPECTED_RECIPE_ID" \
            --build-id "$BUILD_ID" --stage "$SMOKE_STAGE" --output "$RUNNER_TEMP/ami-example-smoke/identity.json"
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Activate image environment for subsequent steps
        run: |
          python3 images/common/runner-image-env --format env >> "$GITHUB_ENV"
          python3 images/common/runner-image-env --format json | jq -r '.path[]' >> "$GITHUB_PATH"
      - run: |
          bash images/xenomai-cobalt/smoke.sh test --release "$EXPECTED_KERNEL_RELEASE" --recipe "$EXPECTED_RECIPE_ID" \
            --build-id "$BUILD_ID" --stage "$SMOKE_STAGE" --output "$RUNNER_TEMP/ami-example-smoke" \
            --source "$GITHUB_WORKSPACE/tests/cobalt" --xenomai-root "$XENOMAI_ROOT"
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.configure.outputs.build_id }}-smoke-a
          path: ${{ runner.temp }}/ami-example-smoke
          retention-days: 14
          if-no-files-found: error

  smoke-b:
    name: smoke-b
    needs: [configure, build, probe, smoke-a]
    runs-on: ${{ needs.build.outputs.label_b }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      EXPECTED_KERNEL_RELEASE: ${{ needs.build.outputs.kernel_release }}
      EXPECTED_RECIPE_ID: ${{ needs.build.outputs.recipe_id }}
      BUILD_ID: ${{ needs.configure.outputs.build_id }}
      SMOKE_STAGE: b
    steps:
      - name: Grant the runner access to Cobalt memory devices
        run: |
          test "$(id -u)" -ne 0
          [[ " $(id -G) " == *" 4242 "* ]]
          prlimit --pid "$$" --memlock --rtprio
          devices=(/dev/rtdm/memdev-private /dev/rtdm/memdev-shared)
          for device in "${devices[@]}"; do
            [[ -c "$device" && ! -L "$device" ]]
          done
          sudo chgrp xenomai "${devices[@]}"
          sudo chmod 0660 "${devices[@]}"
          stat -c '%n %U:%G %a' "${devices[@]}"
      - name: Check running Cobalt kernel and absence of job A sentinel
        run: |
          mkdir -p "$RUNNER_TEMP/ami-example-smoke"
          ami-example-guest-report --release "$EXPECTED_KERNEL_RELEASE" --recipe "$EXPECTED_RECIPE_ID" \
            --build-id "$BUILD_ID" --stage "$SMOKE_STAGE" --output "$RUNNER_TEMP/ami-example-smoke/identity.json"
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Activate image environment for subsequent steps
        run: |
          python3 images/common/runner-image-env --format env >> "$GITHUB_ENV"
          python3 images/common/runner-image-env --format json | jq -r '.path[]' >> "$GITHUB_PATH"
      - run: |
          bash images/xenomai-cobalt/smoke.sh test --release "$EXPECTED_KERNEL_RELEASE" --recipe "$EXPECTED_RECIPE_ID" \
            --build-id "$BUILD_ID" --stage "$SMOKE_STAGE" --output "$RUNNER_TEMP/ami-example-smoke" \
            --source "$GITHUB_WORKSPACE/tests/cobalt" --xenomai-root "$XENOMAI_ROOT"
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.configure.outputs.build_id }}-smoke-b
          path: ${{ runner.temp }}/ami-example-smoke
          retention-days: 14
          if-no-files-found: error

  watchdog:
    name: watchdog
    needs: [configure, register]
    runs-on: ubuntu-24.04
    environment: ${{ needs.configure.outputs.environment }}
    timeout-minutes: 300
    permissions:
      contents: read
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          python3 scripts/install-tools.py --group cloud
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
          echo "PACKER_PLUGIN_PATH=$GITHUB_WORKSPACE/.tools/plugins" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-session-name: ami-example-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ needs.configure.outputs.role_arn }}
          aws-region: ${{ needs.configure.outputs.region }}
          role-duration-seconds: 18000
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.configure.outputs.build_id }}-execution
          path: artifacts/execution
      - id: monitor
        run: |
          test "$(jq -r .run_id "artifacts/execution/execution.json")" = "$GITHUB_RUN_ID"
          test "$(jq -r .run_attempt "artifacts/execution/execution.json")" = "$GITHUB_RUN_ATTEMPT"
          python3 scripts/watchdog.py monitor --record artifacts/execution/execution.json --output artifacts/watchdog
        env:
          GH_TOKEN: ${{ github.token }}
      - if: failure()
        run: |
          if [[ ! -f artifacts/watchdog/watchdog.json ]] || ! jq -e '.status == "upstream_failed"' artifacts/watchdog/watchdog.json; then
            python3 scripts/github-api.py cancel --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.configure.outputs.build_id }}-watchdog
          path: artifacts/watchdog
          retention-days: 14
          if-no-files-found: warn

  finalize:
    name: finalize
    if: always() && needs.configure.result == 'success'
    needs: [configure, build, probe, smoke-a, smoke-b, watchdog]
    runs-on: ubuntu-24.04
    environment: ${{ needs.configure.outputs.environment }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - id: scope
        run: test "$BUILD_ID" = "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${BUILD_ID##*-}"
        env:
          BUILD_ID: ${{ needs.configure.outputs.build_id }}
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        continue-on-error: true
        with:
          pattern: ${{ needs.configure.outputs.build_id }}-*
          path: artifacts/handoff
      - run: |
          python3 scripts/install-tools.py --group cloud
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
          echo "PACKER_PLUGIN_PATH=$GITHUB_WORKSPACE/.tools/plugins" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-session-name: ami-example-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ needs.configure.outputs.role_arn }}
          aws-region: ${{ needs.configure.outputs.region }}
      - run: |
          mkdir -p "artifacts/final/$BUILD_ID"
          if [[ "$VARIANT" == stock ]]; then
            cp "artifacts/handoff/$BUILD_ID-build/stock-result.json" "artifacts/final/$BUILD_ID/stock-result.json"
            jq -e '.status == "passed"' "artifacts/final/$BUILD_ID/stock-result.json"
          else
            cp "artifacts/handoff/$BUILD_ID-build/image-result.json" "artifacts/final/$BUILD_ID/image-result.json"
          fi
        env:
          BUILD_ID: ${{ needs.configure.outputs.build_id }}
          VARIANT: ${{ inputs.variant }}
      - if: needs.smoke-a.result == 'success' && needs.smoke-b.result == 'success' && needs.watchdog.result == 'success'
        run: |
          python3 scripts/github-api.py jobs --record "artifacts/handoff/$BUILD_ID-execution/execution.json" --output artifacts/jobs.json
          python3 scripts/verify-run-results.py --result "artifacts/final/$BUILD_ID/image-result.json" \
            --probe "artifacts/handoff/$BUILD_ID-probe/probe.json" \
            --smoke-a "artifacts/handoff/$BUILD_ID-smoke-a" --smoke-b "artifacts/handoff/$BUILD_ID-smoke-b" \
            --instance-a "$(jq -er '."smoke-a".instance_id' artifacts/jobs.json)" \
            --instance-b "$(jq -er '."smoke-b".instance_id' artifacts/jobs.json)"
        env:
          BUILD_ID: ${{ needs.configure.outputs.build_id }}
          GH_TOKEN: ${{ github.token }}
      - if: always() && steps.scope.outcome == 'success'
        run: python3 scripts/cleanup.py --build-id "$BUILD_ID" --apply --output "artifacts/final/$BUILD_ID/cleanup"
        env:
          BUILD_ID: ${{ needs.configure.outputs.build_id }}
      - if: always() && steps.scope.outcome == 'success' && inputs.variant != 'stock'
        run: |
          python3 scripts/finalize-image.py --build-id "$BUILD_ID" --result "artifacts/final/$BUILD_ID/image-result.json" \
            --cleanup "artifacts/final/$BUILD_ID/cleanup/cleanup-report.json" --output "artifacts/final/$BUILD_ID/image-result.json"
        env:
          BUILD_ID: ${{ needs.configure.outputs.build_id }}
      - if: always() && steps.scope.outcome == 'success'
        run: test "$WATCHDOG_RESULT" = success
        env:
          WATCHDOG_RESULT: ${{ needs.watchdog.result }}
      - if: always() && steps.scope.outcome == 'success'
        run: python3 scripts/retain-artifacts.py --directory "artifacts/final/$BUILD_ID" --prefix "$BUILD_ID/final"
        env:
          BUILD_ID: ${{ needs.configure.outputs.build_id }}
      - if: always() && steps.scope.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.configure.outputs.build_id }}-final
          path: artifacts/final/${{ needs.configure.outputs.build_id }}
          retention-days: 14
          if-no-files-found: error

name: Run Cobalt application

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cobalt-application-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      build_id: ${{ steps.configure.outputs.build_id }}
      label: ${{ steps.configure.outputs.label }}
      recipe_id: ${{ steps.configure.outputs.recipe_id }}
      kernel_release: ${{ steps.configure.outputs.kernel_release }}
      region: ${{ steps.configure.outputs.region }}
      role_arn: ${{ steps.configure.outputs.role_arn }}
      environment: ${{ steps.configure.outputs.environment }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: configure
        run: python3 scripts/accepted_image.py prepare
        env:
          CLOUD_ENABLED: ${{ vars.AMI_EXAMPLE_CLOUD_ENABLED }}

  admission:
    name: test / configure
    needs: prepare
    runs-on: ubuntu-24.04
    environment: ${{ needs.prepare.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 scripts/install-tools.py --group cloud
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-session-name: ami-example-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ needs.prepare.outputs.role_arn }}
          aws-region: ${{ needs.prepare.outputs.region }}
      - run: python3 scripts/accepted_image.py inspect

  application:
    name: test / smoke-a
    needs: [prepare, admission]
    runs-on: ${{ needs.prepare.outputs.label }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      EXPECTED_KERNEL_RELEASE: ${{ needs.prepare.outputs.kernel_release }}
      EXPECTED_RECIPE_ID: ${{ needs.prepare.outputs.recipe_id }}
      BUILD_ID: ${{ needs.prepare.outputs.build_id }}
      SMOKE_STAGE: a
    steps:
      - name: Check accepted Cobalt kernel and fresh instance before checkout
        run: ami-example-smoke identity
      - name: Activate Cobalt environment for subsequent steps
        run: runner-image-env --github
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile and run the Cobalt application
        run: ami-example-smoke test
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ needs.prepare.outputs.build_id }}-application
          path: ${{ runner.temp }}/ami-example-smoke
          retention-days: 14
          if-no-files-found: error

  watchdog:
    needs: [prepare, admission]
    runs-on: ubuntu-24.04
    environment: ${{ needs.prepare.outputs.environment }}
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 scripts/install-tools.py --group cloud
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-session-name: ami-example-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ needs.prepare.outputs.role_arn }}
          aws-region: ${{ needs.prepare.outputs.region }}
      - run: python3 scripts/accepted_image.py watchdog
        env:
          GH_TOKEN: ${{ github.token }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ needs.prepare.outputs.build_id }}-application-watchdog
          path: artifacts/application/watchdog.json
          retention-days: 14
          if-no-files-found: warn

  finalize:
    if: always() && needs.admission.result == 'success'
    needs: [prepare, admission, application, watchdog]
    runs-on: ubuntu-24.04
    environment: ${{ needs.prepare.outputs.environment }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.prepare.outputs.build_id }}-application
          path: artifacts/application/smoke
      - if: always()
        run: python3 scripts/install-tools.py --group cloud
      - if: always()
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-session-name: ami-example-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ needs.prepare.outputs.role_arn }}
          aws-region: ${{ needs.prepare.outputs.region }}
      - run: python3 scripts/accepted_image.py verify
        env:
          GH_TOKEN: ${{ github.token }}
      - if: always()
        run: python3 scripts/cleanup.py --build-id "$BUILD_ID" --apply --output artifacts/application/cleanup
        env:
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
      - if: always()
        run: python3 scripts/accepted_image.py retain
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ needs.prepare.outputs.build_id }}-application-final
          path: artifacts/application
          retention-days: 14
          if-no-files-found: error

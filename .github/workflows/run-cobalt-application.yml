name: Run Cobalt application

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cobalt-application-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  prepare:
    if: vars.AMI_EXAMPLE_CLOUD_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      build_id: ${{ steps.configure.outputs.build_id }}
      label: ${{ steps.configure.outputs.label }}
      recipe_id: ${{ steps.configure.outputs.recipe_id }}
      kernel_release: ${{ steps.configure.outputs.kernel_release }}
      region: ${{ steps.configure.outputs.region }}
      role_arn: ${{ steps.configure.outputs.role_arn }}
      environment: ${{ steps.configure.outputs.environment }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: configure
        run: |
          python3 scripts/accepted_image.py prepare --build-id "$BUILD_ID" --output artifacts/config.json
          jq -r 'to_entries[] | "\(.key)=\(.value)"' artifacts/config.json >> "$GITHUB_OUTPUT"
        env:
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}-one

  admission:
    name: test / configure
    needs: prepare
    runs-on: ubuntu-24.04
    environment: ${{ needs.prepare.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          python3 scripts/install-tools.py --group cloud
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
          echo "PACKER_PLUGIN_PATH=$GITHUB_WORKSPACE/.tools/plugins" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-session-name: ami-example-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ needs.prepare.outputs.role_arn }}
          aws-region: ${{ needs.prepare.outputs.region }}
      - run: |
          python3 scripts/accepted_image.py inspect --output artifacts/application/admission.json \
            --minimum-seconds "$(( $(jq .deadlines.registration_seconds infra/deployment.json) + 900 ))"
      - run: |
          cat > artifacts/job-plan.json <<'JSON'
          {"admission":{"name":"test / configure"},
           "application":{"name":"test / smoke-a","needs":["admission"],"adopt":true}}
          JSON
          test "$BUILD_ID" = "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${BUILD_ID##*-}"
          python3 scripts/watchdog.py register --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --build-id "$BUILD_ID" --plan artifacts/job-plan.json \
            --terminal application --deadline-seconds "$(( $(jq .deadlines.registration_seconds infra/deployment.json) + 900 ))" \
            --registration-seconds "$(jq .deadlines.registration_seconds infra/deployment.json)" \
            --accepted accepted-image.json --output artifacts/execution.json
        env:
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.prepare.outputs.build_id }}-execution
          path: artifacts/execution.json
          if-no-files-found: error

  application:
    name: test / smoke-a
    needs: [prepare, admission]
    runs-on: ${{ needs.prepare.outputs.label }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      EXPECTED_KERNEL_RELEASE: ${{ needs.prepare.outputs.kernel_release }}
      EXPECTED_RECIPE_ID: ${{ needs.prepare.outputs.recipe_id }}
      BUILD_ID: ${{ needs.prepare.outputs.build_id }}
      SMOKE_STAGE: a
    steps:
      - name: Grant the runner access to Cobalt memory devices
        run: |
          test "$(id -u)" -ne 0
          [[ " $(id -G) " == *" 4242 "* ]]
          prlimit --pid "$$" --memlock --rtprio
          devices=(/dev/rtdm/memdev-private /dev/rtdm/memdev-shared)
          for device in "${devices[@]}"; do
            [[ -c "$device" && ! -L "$device" ]]
          done
          sudo chgrp xenomai "${devices[@]}"
          sudo chmod 0660 "${devices[@]}"
          stat -c '%n %U:%G %a' "${devices[@]}"
      - name: Check accepted Cobalt kernel and fresh instance before checkout
        run: |
          mkdir -p "$RUNNER_TEMP/ami-example-smoke"
          ami-example-guest-report --release "$EXPECTED_KERNEL_RELEASE" --recipe "$EXPECTED_RECIPE_ID" \
            --build-id "$BUILD_ID" --stage "$SMOKE_STAGE" --output "$RUNNER_TEMP/ami-example-smoke/identity.json"
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Activate Cobalt environment for subsequent steps
        run: |
          python3 images/common/runner-image-env --format env >> "$GITHUB_ENV"
          python3 images/common/runner-image-env --format json | jq -r '.path[]' >> "$GITHUB_PATH"
      - name: Compile and run the Cobalt application
        run: |
          bash images/xenomai-cobalt/smoke.sh test --release "$EXPECTED_KERNEL_RELEASE" --recipe "$EXPECTED_RECIPE_ID" \
            --build-id "$BUILD_ID" --stage "$SMOKE_STAGE" --output "$RUNNER_TEMP/ami-example-smoke" \
            --source "$GITHUB_WORKSPACE/tests/cobalt" --xenomai-root "$XENOMAI_ROOT"
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.prepare.outputs.build_id }}-application
          path: ${{ runner.temp }}/ami-example-smoke
          retention-days: 14
          if-no-files-found: error

  watchdog:
    needs: [prepare, admission]
    runs-on: ubuntu-24.04
    environment: ${{ needs.prepare.outputs.environment }}
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          python3 scripts/install-tools.py --group cloud
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
          echo "PACKER_PLUGIN_PATH=$GITHUB_WORKSPACE/.tools/plugins" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-session-name: ami-example-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ needs.prepare.outputs.role_arn }}
          aws-region: ${{ needs.prepare.outputs.region }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.prepare.outputs.build_id }}-execution
          path: artifacts/execution
      - id: monitor
        run: |
          test "$(jq -r .run_id "artifacts/execution/execution.json")" = "$GITHUB_RUN_ID"
          test "$(jq -r .run_attempt "artifacts/execution/execution.json")" = "$GITHUB_RUN_ATTEMPT"
          python3 scripts/watchdog.py monitor --record artifacts/execution/execution.json --output artifacts/application
        env:
          GH_TOKEN: ${{ github.token }}
      - if: failure()
        run: |
          if [[ ! -f artifacts/application/watchdog.json ]] || ! jq -e '.status == "upstream_failed"' artifacts/application/watchdog.json; then
            python3 scripts/github-api.py cancel --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.prepare.outputs.build_id }}-application-watchdog
          path: artifacts/application/watchdog.json
          retention-days: 14
          if-no-files-found: warn

  finalize:
    if: always() && needs.admission.result == 'success'
    needs: [prepare, admission, application, watchdog]
    runs-on: ubuntu-24.04
    environment: ${{ needs.prepare.outputs.environment }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - id: scope
        run: test "$BUILD_ID" = "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${BUILD_ID##*-}"
        env:
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.prepare.outputs.build_id }}-application
          path: artifacts/application/smoke
      - if: always() && steps.scope.outcome == 'success'
        run: |
          python3 scripts/install-tools.py --group cloud
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
          echo "PACKER_PLUGIN_PATH=$GITHUB_WORKSPACE/.tools/plugins" >> "$GITHUB_ENV"
      - if: always() && steps.scope.outcome == 'success'
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-session-name: ami-example-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ needs.prepare.outputs.role_arn }}
          aws-region: ${{ needs.prepare.outputs.region }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.prepare.outputs.build_id }}-execution
          path: artifacts/execution
      - if: needs.application.result == 'success' && needs.watchdog.result == 'success'
        run: |
          python3 scripts/github-api.py jobs --record artifacts/execution/execution.json --output artifacts/application/jobs.json
          python3 scripts/accepted_image.py verify --build-id "$BUILD_ID" \
            --instance-id "$(jq -er '.application.instance_id' artifacts/application/jobs.json)" \
            --smoke artifacts/application/smoke --output artifacts/application/result.json
        env:
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
          GH_TOKEN: ${{ github.token }}
      - if: always() && steps.scope.outcome == 'success'
        run: test "$APPLICATION_RESULT" = success && test "$WATCHDOG_RESULT" = success
        env:
          APPLICATION_RESULT: ${{ needs.application.result }}
          WATCHDOG_RESULT: ${{ needs.watchdog.result }}
      - if: always() && steps.scope.outcome == 'success'
        run: python3 scripts/cleanup.py --build-id "$BUILD_ID" --apply --output artifacts/application/cleanup
        env:
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
      - if: always() && steps.scope.outcome == 'success'
        run: python3 scripts/retain-artifacts.py --directory artifacts/application --prefix "$BUILD_ID/application"
        env:
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
      - if: always() && steps.scope.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.prepare.outputs.build_id }}-application-final
          path: artifacts/application
          retention-days: 14
          if-no-files-found: error

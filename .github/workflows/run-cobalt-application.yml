name: Run Cobalt application

on:
  workflow_dispatch: null

permissions:
  contents: read

concurrency:
  group: cobalt-application-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:

  prepare:
    name: test / configure
    if: vars.AMI_EXAMPLE_CLOUD_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: ${{ vars.AMI_DEPLOYMENT_ENVIRONMENT || 'ami-build' }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      deployment_uri: ${{ steps.deployment.outputs.uri }}
      deployment_sha256: ${{ steps.deployment.outputs.sha256 }}
      execution_uri: ${{ steps.register.outputs.uri }}
      execution_sha256: ${{ steps.register.outputs.sha256 }}
      build_id: ${{ steps.config.outputs.build_id }}
      label: ${{ steps.config.outputs.label }}
      recipe_id: ${{ steps.config.outputs.recipe_id }}
      kernel_release: ${{ steps.config.outputs.kernel_release }}
      accepted_uri: ${{ steps.accepted.outputs.uri }}
      accepted_sha256: ${{ steps.accepted.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          python3 scripts/install-tools.py --group cloud
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
          echo "PACKER_PLUGIN_PATH=$GITHUB_WORKSPACE/.tools/plugins" >> "$GITHUB_ENV"
      - id: bootstrap
        name: Resolve bootstrap identity
        run: |
          test -n "$ROLE_ARN" && test -n "$REGION"
          [[ "$STATE_URI" == s3://*/* ]]
          account_id="$(cut -d: -f5 <<< "$ROLE_ARN")"
          [[ "$account_id" =~ ^[0-9]{12}$ ]]
          state_path="${STATE_URI#s3://}"
          bucket="${state_path%%/*}"
          mkdir -p .execution
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg account_id "$account_id" \
            --arg region "$REGION" --arg artifact_bucket "$bucket" \
            '{repository:$repository,account_id:$account_id,region:$region,artifact_bucket:$artifact_bucket}' \
            > .execution/cleanup-context.json
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"
        env:
          ROLE_ARN: ${{ vars.AMI_CONTROLLER_ROLE_ARN }}
          REGION: ${{ vars.AMI_REGION }}
          STATE_URI: ${{ vars.AMI_STATE_URI }}
      - id: auth
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-session-name: ami-example-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ vars.AMI_CONTROLLER_ROLE_ARN }}
          aws-region: ${{ vars.AMI_REGION }}
          allowed-account-ids: ${{ steps.bootstrap.outputs.account_id }}
      - id: deployment
        name: Fetch the immutable deployment bundle
        run: |
          python3 scripts/deployment-state.py fetch --state-root "$STATE_URI" \
            --account-id "$ACCOUNT_ID" --region "$REGION" --repository "$GITHUB_REPOSITORY" --output .deployment
          jq -r 'to_entries[] | "\(.key)=\(.value)"' .deployment/binding.json >> "$GITHUB_OUTPUT"
        env:
          ACCOUNT_ID: ${{ steps.bootstrap.outputs.account_id }}
          REGION: ${{ vars.AMI_REGION }}
          STATE_URI: ${{ vars.AMI_STATE_URI }}
      - id: accepted
        run: |
          python3 scripts/deployment-state.py fetch-accepted --state-root "$STATE_URI" \
            --account-id "$ACCOUNT_ID" --region "$REGION" --repository "$GITHUB_REPOSITORY" --output .deployment/accepted-image.json
          jq -r 'to_entries[] | "\(.key)=\(.value)"' .deployment/accepted-image.json.binding.json >> "$GITHUB_OUTPUT"
        env:
          STATE_URI: ${{ vars.AMI_STATE_URI }}
          ACCOUNT_ID: ${{ steps.bootstrap.outputs.account_id }}
          REGION: ${{ vars.AMI_REGION }}
      - id: config
        run: |
          python3 scripts/accepted_image.py prepare --deployment .deployment/deployment.json \
            --record .deployment/accepted-image.json --build-id "$BUILD_ID" --output .deployment/config.json
          python3 scripts/accepted_image.py inspect --deployment .deployment/deployment.json \
            --record .deployment/accepted-image.json --output .deployment/admission.json \
            --minimum-seconds "$(( $(jq .deadlines.registration_seconds .deployment/deployment.json) + 900 ))"
          jq -r '{build_id,label,recipe_id,kernel_release} | to_entries[] | "\(.key)=\(.value)"' .deployment/config.json >> "$GITHUB_OUTPUT"
        env:
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}-one
      - id: register
        name: Freeze execution before launching runners
        run: |
          cat > .execution/job-plan.json <<'JSON'
          {"prepare":{"name":"test / configure"},
           "application":{"name":"test / smoke-a","needs":["prepare"],"adopt":true}}
          JSON
          test "$BUILD_ID" = "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${BUILD_ID##*-}"
          python3 scripts/watchdog.py register --deployment .deployment/deployment.json \
            --configuration-binding .deployment/binding.json --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --build-id "$BUILD_ID" --plan .execution/job-plan.json \
            --terminal application --deadline-seconds "$(( $(jq .deadlines.registration_seconds .deployment/deployment.json) + 900 ))" \
            --registration-seconds "$(jq .deadlines.registration_seconds .deployment/deployment.json)" --accepted .deployment/accepted-image.json \
            --output .execution/record.json --binding-output .execution/binding.json
          jq -r 'to_entries[] | "\(.key)=\(.value)"' .execution/binding.json >> "$GITHUB_OUTPUT"
        env:
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}-one

  application:
    name: test / smoke-a
    if: startsWith(needs.prepare.outputs.build_id, format('{0}-{1}-', github.run_id, github.run_attempt))
    needs: prepare
    runs-on: ${{ needs.prepare.outputs.label }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      EXPECTED_KERNEL_RELEASE: ${{ needs.prepare.outputs.kernel_release }}
      EXPECTED_RECIPE_ID: ${{ needs.prepare.outputs.recipe_id }}
      BUILD_ID: ${{ needs.prepare.outputs.build_id }}
      SMOKE_STAGE: a
    steps:
      - name: Grant the runner access to Cobalt memory devices
        run: |
          test "$(id -u)" -ne 0
          [[ " $(id -G) " == *" 4242 "* ]]
          prlimit --pid "$$" --memlock --rtprio
          devices=(/dev/rtdm/memdev-private /dev/rtdm/memdev-shared)
          for device in "${devices[@]}"; do
            [[ -c "$device" && ! -L "$device" ]]
          done
          sudo chgrp xenomai "${devices[@]}"
          sudo chmod 0660 "${devices[@]}"
          stat -c '%n %U:%G %a' "${devices[@]}"
      - name: Check accepted Cobalt kernel and fresh instance before checkout
        run: |
          mkdir -p "$RUNNER_TEMP/ami-example-smoke"
          ami-example-guest-report --release "$EXPECTED_KERNEL_RELEASE" --recipe "$EXPECTED_RECIPE_ID" \
            --build-id "$BUILD_ID" --stage "$SMOKE_STAGE" --output "$RUNNER_TEMP/ami-example-smoke/identity.json"
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Activate Cobalt environment for subsequent steps
        run: |
          python3 images/common/runner-image-env --format env >> "$GITHUB_ENV"
          python3 images/common/runner-image-env --format json | jq -r '.path[]' >> "$GITHUB_PATH"
      - name: Compile and run the Cobalt application
        run: |
          bash images/xenomai-cobalt/smoke.sh test --release "$EXPECTED_KERNEL_RELEASE" --recipe "$EXPECTED_RECIPE_ID" \
            --build-id "$BUILD_ID" --stage "$SMOKE_STAGE" --output "$RUNNER_TEMP/ami-example-smoke" \
            --source "$GITHUB_WORKSPACE/tests/cobalt" --xenomai-root "$XENOMAI_ROOT"
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.prepare.outputs.build_id }}-application
          path: ${{ runner.temp }}/ami-example-smoke
          retention-days: 14
          if-no-files-found: error

  watchdog:
    needs: prepare
    runs-on: ubuntu-24.04
    environment: ${{ vars.AMI_DEPLOYMENT_ENVIRONMENT || 'ami-build' }}
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          python3 scripts/install-tools.py --group cloud
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
          echo "PACKER_PLUGIN_PATH=$GITHUB_WORKSPACE/.tools/plugins" >> "$GITHUB_ENV"
      - id: bootstrap
        name: Resolve bootstrap identity
        run: |
          test -n "$ROLE_ARN" && test -n "$REGION"
          [[ "$STATE_URI" == s3://*/* ]]
          account_id="$(cut -d: -f5 <<< "$ROLE_ARN")"
          [[ "$account_id" =~ ^[0-9]{12}$ ]]
          state_path="${STATE_URI#s3://}"
          bucket="${state_path%%/*}"
          mkdir -p .execution
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg account_id "$account_id" \
            --arg region "$REGION" --arg artifact_bucket "$bucket" \
            '{repository:$repository,account_id:$account_id,region:$region,artifact_bucket:$artifact_bucket}' \
            > .execution/cleanup-context.json
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"
        env:
          ROLE_ARN: ${{ vars.AMI_CONTROLLER_ROLE_ARN }}
          REGION: ${{ vars.AMI_REGION }}
          STATE_URI: ${{ vars.AMI_STATE_URI }}
      - id: auth
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-session-name: ami-example-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ vars.AMI_CONTROLLER_ROLE_ARN }}
          aws-region: ${{ vars.AMI_REGION }}
          allowed-account-ids: ${{ steps.bootstrap.outputs.account_id }}
      - id: execution
        name: Fetch the frozen execution
        run: |
          python3 scripts/deployment-state.py download --cleanup-context .execution/cleanup-context.json \
            --uri "$EXECUTION_URI" --sha256 "$EXECUTION_SHA256" --output .execution/record.json
          test "$(jq -r .run_id .execution/record.json)" = "$GITHUB_RUN_ID"
          test "$(jq -r .run_attempt .execution/record.json)" = "$GITHUB_RUN_ATTEMPT"
        env:
          EXECUTION_URI: ${{ needs.prepare.outputs.execution_uri }}
          EXECUTION_SHA256: ${{ needs.prepare.outputs.execution_sha256 }}
      - id: monitor
        run: python3 scripts/watchdog.py monitor --record .execution/record.json --output artifacts/application
        env:
          GH_TOKEN: ${{ github.token }}
      - if: failure()
        run: |
          if [[ ! -f artifacts/application/watchdog.json ]] || ! jq -e '.status == "upstream_failed"' artifacts/application/watchdog.json; then
            python3 scripts/github-api.py cancel --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  finalize:
    if: always() && needs.prepare.result == 'success'
    needs:
      - prepare
      - application
      - watchdog
    runs-on: ubuntu-24.04
    environment: ${{ vars.AMI_DEPLOYMENT_ENVIRONMENT || 'ami-build' }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - id: scope
        run: test "$BUILD_ID" = "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${BUILD_ID##*-}"
        env:
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          python3 scripts/install-tools.py --group cloud
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
          echo "PACKER_PLUGIN_PATH=$GITHUB_WORKSPACE/.tools/plugins" >> "$GITHUB_ENV"
      - id: bootstrap
        name: Resolve bootstrap identity
        run: |
          test -n "$ROLE_ARN" && test -n "$REGION"
          [[ "$STATE_URI" == s3://*/* ]]
          account_id="$(cut -d: -f5 <<< "$ROLE_ARN")"
          [[ "$account_id" =~ ^[0-9]{12}$ ]]
          state_path="${STATE_URI#s3://}"
          bucket="${state_path%%/*}"
          mkdir -p .execution
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg account_id "$account_id" \
            --arg region "$REGION" --arg artifact_bucket "$bucket" \
            '{repository:$repository,account_id:$account_id,region:$region,artifact_bucket:$artifact_bucket}' \
            > .execution/cleanup-context.json
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"
        env:
          ROLE_ARN: ${{ vars.AMI_CONTROLLER_ROLE_ARN }}
          REGION: ${{ vars.AMI_REGION }}
          STATE_URI: ${{ vars.AMI_STATE_URI }}
      - id: auth
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-session-name: ami-example-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ vars.AMI_CONTROLLER_ROLE_ARN }}
          aws-region: ${{ vars.AMI_REGION }}
          allowed-account-ids: ${{ steps.bootstrap.outputs.account_id }}
      - id: execution
        name: Fetch the frozen execution
        run: |
          python3 scripts/deployment-state.py download --cleanup-context .execution/cleanup-context.json \
            --uri "$EXECUTION_URI" --sha256 "$EXECUTION_SHA256" --output .execution/record.json
          test "$(jq -r .run_id .execution/record.json)" = "$GITHUB_RUN_ID"
          test "$(jq -r .run_attempt .execution/record.json)" = "$GITHUB_RUN_ATTEMPT"
        env:
          EXECUTION_URI: ${{ needs.prepare.outputs.execution_uri }}
          EXECUTION_SHA256: ${{ needs.prepare.outputs.execution_sha256 }}
      - id: deployment
        name: Fetch the immutable deployment bundle
        run: |
          python3 scripts/deployment-state.py fetch --uri "$DEPLOYMENT_URI" --sha256 "$DEPLOYMENT_SHA256" \
            --account-id "$ACCOUNT_ID" --region "$REGION" --repository "$GITHUB_REPOSITORY" --output .deployment
          jq -r 'to_entries[] | "\(.key)=\(.value)"' .deployment/binding.json >> "$GITHUB_OUTPUT"
        env:
          ACCOUNT_ID: ${{ steps.bootstrap.outputs.account_id }}
          REGION: ${{ vars.AMI_REGION }}
          DEPLOYMENT_URI: ${{ needs.prepare.outputs.deployment_uri }}
          DEPLOYMENT_SHA256: ${{ needs.prepare.outputs.deployment_sha256 }}
      - run: |
          python3 scripts/deployment-state.py fetch-accepted --uri "$ACCEPTED_URI" --sha256 "$ACCEPTED_SHA256" \
            --account-id "$ACCOUNT_ID" --region "$REGION" --repository "$GITHUB_REPOSITORY" --output .deployment/accepted-image.json
        env:
          ACCEPTED_URI: ${{ needs.prepare.outputs.accepted_uri }}
          ACCEPTED_SHA256: ${{ needs.prepare.outputs.accepted_sha256 }}
          ACCOUNT_ID: ${{ steps.bootstrap.outputs.account_id }}
          REGION: ${{ vars.AMI_REGION }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.prepare.outputs.build_id }}-application
          path: artifacts/application/smoke
      - if: needs.application.result == 'success' && needs.watchdog.result == 'success'
        run: |
          python3 scripts/github-api.py jobs --record .execution/record.json --output .execution/jobs.json
          python3 scripts/accepted_image.py verify --deployment .deployment/deployment.json --record .deployment/accepted-image.json \
            --build-id "$BUILD_ID" --instance-id "$(jq -er '.application.instance_id' .execution/jobs.json)" \
            --smoke artifacts/application/smoke --output artifacts/application/result.json
        env:
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
          GH_TOKEN: ${{ github.token }}
      - if: always() && steps.scope.outcome == 'success' && steps.auth.outcome == 'success'
        run: test "$APPLICATION_RESULT" = success && test "$WATCHDOG_RESULT" = success
        env:
          APPLICATION_RESULT: ${{ needs.application.result }}
          WATCHDOG_RESULT: ${{ needs.watchdog.result }}
      - if: always() && steps.scope.outcome == 'success' && steps.auth.outcome == 'success'
        run: |
          python3 scripts/cleanup.py --cleanup-context .execution/cleanup-context.json \
            --build-id "$BUILD_ID" --apply --output artifacts/application/cleanup
        env:
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
      - if: always() && steps.scope.outcome == 'success' && steps.auth.outcome == 'success'
        run: |
          python3 scripts/retain-artifacts.py --cleanup-context .execution/cleanup-context.json \
            --directory artifacts/application --prefix "$BUILD_ID/application" --output artifacts/application/artifact-index.json
        env:
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
      - if: always() && steps.scope.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.prepare.outputs.build_id }}-application-final
          path: |-
            artifacts/application/result.json
            artifacts/application/smoke
          retention-days: 14
          if-no-files-found: warn

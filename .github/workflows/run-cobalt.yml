name: Build and test on Xenomai Cobalt

on:
  workflow_dispatch:
    inputs:
      ami_id:
        description: Custom Xenomai Cobalt AMI ID
        required: true
        type: string
      environment:
        description: RunsOn environment
        required: true
        default: production
        type: string
      region:
        description: AWS region containing the AMI and RunsOn deployment
        required: true
        default: us-east-1
        type: string

permissions:
  contents: read

jobs:
  cobalt:
    runs-on:
      - runs-on=${{ github.run_id }}-${{ github.run_attempt }}
      - family=t3.small
      - cpu=2
      - volume=16gb:gp3:125mbs:3000iops
      - spot=false
      - retry=false
      - private=false
      - env=${{ inputs.environment }}
      - region=${{ inputs.region }}
      - ami=${{ inputs.ami_id }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure the application
        run: |
          cmake -S execution/cobalt -B execution/.local/cobalt \
            -DXENOMAI_ROOT=/usr/xenomai
      - name: Build the application
        run: cmake --build execution/.local/cobalt
      - name: Test the application
        run: ctest --test-dir execution/.local/cobalt --verbose --output-on-failure

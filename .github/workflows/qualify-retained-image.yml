name: Qualify retained Cobalt image

on:
  workflow_dispatch:
    inputs:
      candidate_result_uri:
        description: Immutable versioned S3 URI of the retained candidate result
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: retained-ami-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  configure:
    if: vars.AMI_EXAMPLE_CLOUD_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      build_id: ${{ steps.config.outputs.build_id }}
      region: ${{ steps.config.outputs.region }}
      role_arn: ${{ steps.config.outputs.role_arn }}
      environment: ${{ steps.config.outputs.environment }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: config
        run: |
          python3 scripts/image-config.py --build-id "$BUILD_ID" --output artifacts/config.json
          jq -r 'to_entries[] | "\(.key)=\(.value)"' artifacts/config.json >> "$GITHUB_OUTPUT"
        env:
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}-one

  prepare:
    name: one / configure
    needs: configure
    runs-on: ubuntu-24.04
    environment: ${{ needs.configure.outputs.environment }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      ami_id: ${{ steps.prepare.outputs.ami_id }}
      recipe_id: ${{ steps.prepare.outputs.recipe_id }}
      kernel_release: ${{ steps.prepare.outputs.kernel_release }}
      label_a: ${{ steps.prepare.outputs.label_a }}
      label_b: ${{ steps.prepare.outputs.label_b }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          python3 scripts/install-tools.py --group cloud
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
          echo "PACKER_PLUGIN_PATH=$GITHUB_WORKSPACE/.tools/plugins" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-session-name: ami-example-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ needs.configure.outputs.role_arn }}
          aws-region: ${{ needs.configure.outputs.region }}
      - id: prepare
        run: |
          test "$BUILD_ID" = "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-one"
          python3 scripts/retained_candidate.py prepare --build-id "$BUILD_ID" --source-uri "$CANDIDATE_RESULT_URI" \
            --output "artifacts/$BUILD_ID" --config-output artifacts/config.json \
            --minimum-seconds "$(jq '.deadlines.boot_seconds + 2 * .deadlines.registration_seconds + 1800' infra/deployment.json)"
          jq -r 'to_entries[] | "\(.key)=\(.value)"' artifacts/config.json >> "$GITHUB_OUTPUT"
        env:
          CANDIDATE_RESULT_URI: ${{ inputs.candidate_result_uri }}
          BUILD_ID: ${{ needs.configure.outputs.build_id }}
      - run: |
          cat > "artifacts/$BUILD_ID/job-plan.json" <<'JSON'
          {"prepare":{"name":"one / configure"},"probe":{"name":"one / probe"},
           "smoke-a":{"name":"one / smoke-a","needs":["probe"],"adopt":true},
           "smoke-b":{"name":"one / smoke-b","needs":["smoke-a"],"adopt":true}}
          JSON
          test "$BUILD_ID" = "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${BUILD_ID##*-}"
          python3 scripts/watchdog.py register --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --build-id "$BUILD_ID" --plan "artifacts/$BUILD_ID/job-plan.json" \
            --terminal smoke-b --deadline-seconds 2700 \
            --registration-seconds "$(jq .deadlines.registration_seconds infra/deployment.json)" \
            --result "artifacts/$BUILD_ID/image-result.json" --output "artifacts/$BUILD_ID/execution.json"
        env:
          BUILD_ID: ${{ needs.configure.outputs.build_id }}
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.configure.outputs.build_id }}-build
          path: |
            artifacts/${{ needs.configure.outputs.build_id }}
            !artifacts/**/inputs.tar
          retention-days: 14
          if-no-files-found: warn

  probe:
    name: one / probe
    needs: [configure, prepare]
    runs-on: ubuntu-24.04
    environment: ${{ needs.configure.outputs.environment }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.configure.outputs.build_id }}-build
          path: artifacts/${{ needs.configure.outputs.build_id }}
      - run: |
          python3 scripts/install-tools.py --group cloud
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
          echo "PACKER_PLUGIN_PATH=$GITHUB_WORKSPACE/.tools/plugins" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-session-name: ami-example-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ needs.configure.outputs.role_arn }}
          aws-region: ${{ needs.configure.outputs.region }}
      - run: |
          test "$BUILD_ID" = "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-one"
          python3 scripts/probe-ami.py --result "artifacts/$BUILD_ID/image-result.json" --build-id "$BUILD_ID" --execute
        env:
          BUILD_ID: ${{ needs.configure.outputs.build_id }}
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.configure.outputs.build_id }}-probe
          path: artifacts/${{ needs.configure.outputs.build_id }}/probe
          retention-days: 14
          if-no-files-found: warn

  smoke-a:
    name: one / smoke-a
    needs: [configure, prepare, probe]
    runs-on: ${{ needs.prepare.outputs.label_a }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      EXPECTED_KERNEL_RELEASE: ${{ needs.prepare.outputs.kernel_release }}
      EXPECTED_RECIPE_ID: ${{ needs.prepare.outputs.recipe_id }}
      BUILD_ID: ${{ needs.configure.outputs.build_id }}
      SMOKE_STAGE: a
    steps:
      - name: Grant the runner access to Cobalt memory devices
        run: |
          test "$(id -u)" -ne 0
          [[ " $(id -G) " == *" 4242 "* ]]
          prlimit --pid "$$" --memlock --rtprio
          devices=(/dev/rtdm/memdev-private /dev/rtdm/memdev-shared)
          for device in "${devices[@]}"; do
            [[ -c "$device" && ! -L "$device" ]]
          done
          sudo chgrp xenomai "${devices[@]}"
          sudo chmod 0660 "${devices[@]}"
          stat -c '%n %U:%G %a' "${devices[@]}"
      - name: Check running Cobalt kernel and fresh image before checkout
        run: |
          mkdir -p "$RUNNER_TEMP/ami-example-smoke"
          ami-example-guest-report --release "$EXPECTED_KERNEL_RELEASE" --recipe "$EXPECTED_RECIPE_ID" \
            --build-id "$BUILD_ID" --stage "$SMOKE_STAGE" --output "$RUNNER_TEMP/ami-example-smoke/identity.json"
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Activate image environment for subsequent steps
        run: |
          python3 images/common/runner-image-env --format env >> "$GITHUB_ENV"
          python3 images/common/runner-image-env --format json | jq -r '.path[]' >> "$GITHUB_PATH"
      - run: |
          bash images/xenomai-cobalt/smoke.sh test --release "$EXPECTED_KERNEL_RELEASE" --recipe "$EXPECTED_RECIPE_ID" \
            --build-id "$BUILD_ID" --stage "$SMOKE_STAGE" --output "$RUNNER_TEMP/ami-example-smoke" \
            --source "$GITHUB_WORKSPACE/tests/cobalt" --xenomai-root "$XENOMAI_ROOT"
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.configure.outputs.build_id }}-smoke-a
          path: ${{ runner.temp }}/ami-example-smoke
          retention-days: 14
          if-no-files-found: error

  smoke-b:
    name: one / smoke-b
    needs: [configure, prepare, probe, smoke-a]
    runs-on: ${{ needs.prepare.outputs.label_b }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      EXPECTED_KERNEL_RELEASE: ${{ needs.prepare.outputs.kernel_release }}
      EXPECTED_RECIPE_ID: ${{ needs.prepare.outputs.recipe_id }}
      BUILD_ID: ${{ needs.configure.outputs.build_id }}
      SMOKE_STAGE: b
    steps:
      - name: Grant the runner access to Cobalt memory devices
        run: |
          test "$(id -u)" -ne 0
          [[ " $(id -G) " == *" 4242 "* ]]
          prlimit --pid "$$" --memlock --rtprio
          devices=(/dev/rtdm/memdev-private /dev/rtdm/memdev-shared)
          for device in "${devices[@]}"; do
            [[ -c "$device" && ! -L "$device" ]]
          done
          sudo chgrp xenomai "${devices[@]}"
          sudo chmod 0660 "${devices[@]}"
          stat -c '%n %U:%G %a' "${devices[@]}"
      - name: Check running Cobalt kernel and absence of job A sentinel
        run: |
          mkdir -p "$RUNNER_TEMP/ami-example-smoke"
          ami-example-guest-report --release "$EXPECTED_KERNEL_RELEASE" --recipe "$EXPECTED_RECIPE_ID" \
            --build-id "$BUILD_ID" --stage "$SMOKE_STAGE" --output "$RUNNER_TEMP/ami-example-smoke/identity.json"
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Activate image environment for subsequent steps
        run: |
          python3 images/common/runner-image-env --format env >> "$GITHUB_ENV"
          python3 images/common/runner-image-env --format json | jq -r '.path[]' >> "$GITHUB_PATH"
      - run: |
          bash images/xenomai-cobalt/smoke.sh test --release "$EXPECTED_KERNEL_RELEASE" --recipe "$EXPECTED_RECIPE_ID" \
            --build-id "$BUILD_ID" --stage "$SMOKE_STAGE" --output "$RUNNER_TEMP/ami-example-smoke" \
            --source "$GITHUB_WORKSPACE/tests/cobalt" --xenomai-root "$XENOMAI_ROOT"
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.configure.outputs.build_id }}-smoke-b
          path: ${{ runner.temp }}/ami-example-smoke
          retention-days: 14
          if-no-files-found: error

  watchdog:
    name: one / watchdog
    needs: [configure, prepare]
    runs-on: ubuntu-24.04
    environment: ${{ needs.configure.outputs.environment }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.configure.outputs.build_id }}-build
          path: artifacts/${{ needs.configure.outputs.build_id }}
      - run: |
          python3 scripts/install-tools.py --group cloud
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
          echo "PACKER_PLUGIN_PATH=$GITHUB_WORKSPACE/.tools/plugins" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-session-name: ami-example-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ needs.configure.outputs.role_arn }}
          aws-region: ${{ needs.configure.outputs.region }}
          role-duration-seconds: 7200
      - id: monitor
        run: |
          test "$(jq -r .run_id "artifacts/$BUILD_ID/execution.json")" = "$GITHUB_RUN_ID"
          test "$(jq -r .run_attempt "artifacts/$BUILD_ID/execution.json")" = "$GITHUB_RUN_ATTEMPT"
          python3 scripts/watchdog.py monitor --record "artifacts/$BUILD_ID/execution.json" --output artifacts/watchdog
        env:
          BUILD_ID: ${{ needs.configure.outputs.build_id }}
          GH_TOKEN: ${{ github.token }}
      - if: failure()
        run: |
          if [[ ! -f artifacts/watchdog/watchdog.json ]] || ! jq -e '.status == "upstream_failed"' artifacts/watchdog/watchdog.json; then
            python3 scripts/github-api.py cancel --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.configure.outputs.build_id }}-watchdog
          path: artifacts/watchdog
          retention-days: 14
          if-no-files-found: warn

  finalize:
    name: one / finalize
    if: always() && needs.prepare.result == 'success'
    needs: [configure, prepare, probe, smoke-a, smoke-b, watchdog]
    runs-on: ubuntu-24.04
    environment: ${{ needs.configure.outputs.environment }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - id: scope
        run: test "$BUILD_ID" = "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${BUILD_ID##*-}"
        env:
          BUILD_ID: ${{ needs.configure.outputs.build_id }}
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        continue-on-error: true
        with:
          pattern: ${{ needs.configure.outputs.build_id }}-*
          path: artifacts/handoff
      - run: |
          python3 scripts/install-tools.py --group cloud
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
          echo "PACKER_PLUGIN_PATH=$GITHUB_WORKSPACE/.tools/plugins" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-session-name: ami-example-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ needs.configure.outputs.role_arn }}
          aws-region: ${{ needs.configure.outputs.region }}
      - run: |
          mkdir -p "artifacts/final/$BUILD_ID"
          if [[ "$VARIANT" == stock ]]; then
            cp "artifacts/handoff/$BUILD_ID-build/stock-result.json" "artifacts/final/$BUILD_ID/stock-result.json"
            jq -e '.status == "passed"' "artifacts/final/$BUILD_ID/stock-result.json"
          else
            cp "artifacts/handoff/$BUILD_ID-build/image-result.json" "artifacts/final/$BUILD_ID/image-result.json"
          fi
        env:
          BUILD_ID: ${{ needs.configure.outputs.build_id }}
          VARIANT: one
      - if: needs.smoke-a.result == 'success' && needs.smoke-b.result == 'success' && needs.watchdog.result == 'success'
        run: |
          python3 scripts/github-api.py jobs --record "artifacts/handoff/$BUILD_ID-build/execution.json" --output artifacts/jobs.json
          python3 scripts/verify-run-results.py --result "artifacts/final/$BUILD_ID/image-result.json" \
            --probe "artifacts/handoff/$BUILD_ID-probe/probe.json" \
            --smoke-a "artifacts/handoff/$BUILD_ID-smoke-a" --smoke-b "artifacts/handoff/$BUILD_ID-smoke-b" \
            --instance-a "$(jq -er '."smoke-a".instance_id' artifacts/jobs.json)" \
            --instance-b "$(jq -er '."smoke-b".instance_id' artifacts/jobs.json)"
        env:
          BUILD_ID: ${{ needs.configure.outputs.build_id }}
          GH_TOKEN: ${{ github.token }}
      - if: always() && steps.scope.outcome == 'success'
        run: python3 scripts/cleanup.py --build-id "$BUILD_ID" --apply --output "artifacts/final/$BUILD_ID/cleanup"
        env:
          BUILD_ID: ${{ needs.configure.outputs.build_id }}
      - if: always() && steps.scope.outcome == 'success' && true
        run: |
          python3 scripts/finalize-image.py --build-id "$BUILD_ID" --result "artifacts/final/$BUILD_ID/image-result.json" \
            --cleanup "artifacts/final/$BUILD_ID/cleanup/cleanup-report.json" --output "artifacts/final/$BUILD_ID/image-result.json"
        env:
          BUILD_ID: ${{ needs.configure.outputs.build_id }}
      - if: always() && steps.scope.outcome == 'success'
        run: test "$WATCHDOG_RESULT" = success
        env:
          WATCHDOG_RESULT: ${{ needs.watchdog.result }}
      - if: always() && steps.scope.outcome == 'success'
        run: python3 scripts/retain-artifacts.py --directory "artifacts/final/$BUILD_ID" --prefix "$BUILD_ID/final"
        env:
          BUILD_ID: ${{ needs.configure.outputs.build_id }}
      - if: always() && steps.scope.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.configure.outputs.build_id }}-final
          path: artifacts/final/${{ needs.configure.outputs.build_id }}
          retention-days: 14
          if-no-files-found: error

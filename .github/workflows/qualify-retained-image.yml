name: Qualify retained Cobalt image

on:
  workflow_dispatch:
    inputs:
      candidate_result_uri:
        description: Immutable versioned S3 URI of the retained candidate result
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: retained-ami-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:

  prepare:
    name: one / configure
    if: vars.AMI_EXAMPLE_CLOUD_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: ${{ vars.AMI_DEPLOYMENT_ENVIRONMENT || 'ami-build' }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      deployment_uri: ${{ steps.deployment.outputs.uri }}
      deployment_sha256: ${{ steps.deployment.outputs.sha256 }}
      execution_uri: ${{ steps.register.outputs.uri }}
      execution_sha256: ${{ steps.register.outputs.sha256 }}
      build_id: ${{ steps.config.outputs.build_id }}
      ami_id: ${{ steps.config.outputs.ami_id }}
      recipe_id: ${{ steps.config.outputs.recipe_id }}
      kernel_release: ${{ steps.config.outputs.kernel_release }}
      instance_type: ${{ steps.config.outputs.instance_type }}
      vcpus: ${{ steps.config.outputs.vcpus }}
      runs_on_environment: ${{ steps.config.outputs.runs_on_environment }}
      region: ${{ steps.config.outputs.region }}
      private: ${{ steps.config.outputs.private }}
      root_volume_gib: ${{ steps.config.outputs.root_volume_gib }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          python3 scripts/install-tools.py --group cloud
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
          echo "PACKER_PLUGIN_PATH=$GITHUB_WORKSPACE/.tools/plugins" >> "$GITHUB_ENV"
      - id: bootstrap
        name: Resolve bootstrap identity
        run: |
          test -n "$ROLE_ARN" && test -n "$REGION"
          [[ "$STATE_URI" == s3://*/* ]]
          account_id="$(cut -d: -f5 <<< "$ROLE_ARN")"
          [[ "$account_id" =~ ^[0-9]{12}$ ]]
          state_path="${STATE_URI#s3://}"
          bucket="${state_path%%/*}"
          mkdir -p .execution
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg account_id "$account_id" \
            --arg region "$REGION" --arg artifact_bucket "$bucket" \
            '{repository:$repository,account_id:$account_id,region:$region,artifact_bucket:$artifact_bucket}' \
            > .execution/cleanup-context.json
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"
        env:
          ROLE_ARN: ${{ vars.AMI_CONTROLLER_ROLE_ARN }}
          REGION: ${{ vars.AMI_REGION }}
          STATE_URI: ${{ vars.AMI_STATE_URI }}
      - id: auth
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-session-name: ami-example-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ vars.AMI_CONTROLLER_ROLE_ARN }}
          aws-region: ${{ vars.AMI_REGION }}
          allowed-account-ids: ${{ steps.bootstrap.outputs.account_id }}
      - id: deployment
        name: Fetch the immutable deployment bundle
        run: |
          python3 scripts/deployment-state.py fetch --state-root "$STATE_URI" \
            --account-id "$ACCOUNT_ID" --region "$REGION" --repository "$GITHUB_REPOSITORY" --output .deployment
          jq -r 'to_entries[] | "\(.key)=\(.value)"' .deployment/binding.json >> "$GITHUB_OUTPUT"
        env:
          ACCOUNT_ID: ${{ steps.bootstrap.outputs.account_id }}
          REGION: ${{ vars.AMI_REGION }}
          STATE_URI: ${{ vars.AMI_STATE_URI }}
      - id: config
        run: |
          python3 scripts/retained_candidate.py prepare --deployment .deployment/deployment.json \
            --build-id "$BUILD_ID" --source-uri "$CANDIDATE_RESULT_URI" --output "artifacts/$BUILD_ID" --config-output .deployment/config.json \
            --minimum-seconds "$(jq '.deadlines | .boot_seconds + 2 * .registration_seconds + 1800' .deployment/deployment.json)"
          jq -r 'to_entries[] | "\(.key)=\(.value)"' .deployment/config.json >> "$GITHUB_OUTPUT"
        env:
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}-one
          CANDIDATE_RESULT_URI: ${{ inputs.candidate_result_uri }}
      - id: register
        name: Freeze execution before launching runners
        run: |
          cat > .execution/job-plan.json <<'JSON'
          {"prepare":{"name":"one / configure"},"probe":{"name":"one / probe"},
           "smoke-a":{"name":"one / smoke-a","needs":["probe"],"adopt":true},
           "smoke-b":{"name":"one / smoke-b","needs":["smoke-a"],"adopt":true}}
          JSON
          test "$BUILD_ID" = "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${BUILD_ID##*-}"
          python3 scripts/watchdog.py register --deployment .deployment/deployment.json \
            --configuration-binding .deployment/binding.json --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --build-id "$BUILD_ID" --plan .execution/job-plan.json \
            --terminal smoke-b --deadline-seconds 2700 \
            --registration-seconds "$(jq .deadlines.registration_seconds .deployment/deployment.json)" --result "artifacts/$BUILD_ID/image-result.json" \
            --output .execution/record.json --binding-output .execution/binding.json
          jq -r 'to_entries[] | "\(.key)=\(.value)"' .execution/binding.json >> "$GITHUB_OUTPUT"
        env:
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}-one
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ github.run_id }}-${{ github.run_attempt }}-one-build
          path: artifacts/${{ github.run_id }}-${{ github.run_attempt }}-one/image-result.json
          retention-days: 14
          if-no-files-found: warn

  probe:
    name: one / probe
    needs: prepare
    runs-on: ubuntu-24.04
    environment: ${{ vars.AMI_DEPLOYMENT_ENVIRONMENT || 'ami-build' }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          python3 scripts/install-tools.py --group cloud
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
          echo "PACKER_PLUGIN_PATH=$GITHUB_WORKSPACE/.tools/plugins" >> "$GITHUB_ENV"
      - id: bootstrap
        name: Resolve bootstrap identity
        run: |
          test -n "$ROLE_ARN" && test -n "$REGION"
          [[ "$STATE_URI" == s3://*/* ]]
          account_id="$(cut -d: -f5 <<< "$ROLE_ARN")"
          [[ "$account_id" =~ ^[0-9]{12}$ ]]
          state_path="${STATE_URI#s3://}"
          bucket="${state_path%%/*}"
          mkdir -p .execution
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg account_id "$account_id" \
            --arg region "$REGION" --arg artifact_bucket "$bucket" \
            '{repository:$repository,account_id:$account_id,region:$region,artifact_bucket:$artifact_bucket}' \
            > .execution/cleanup-context.json
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"
        env:
          ROLE_ARN: ${{ vars.AMI_CONTROLLER_ROLE_ARN }}
          REGION: ${{ vars.AMI_REGION }}
          STATE_URI: ${{ vars.AMI_STATE_URI }}
      - id: auth
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-session-name: ami-example-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ vars.AMI_CONTROLLER_ROLE_ARN }}
          aws-region: ${{ vars.AMI_REGION }}
          allowed-account-ids: ${{ steps.bootstrap.outputs.account_id }}
      - id: deployment
        name: Fetch the immutable deployment bundle
        run: |
          python3 scripts/deployment-state.py fetch --uri "$DEPLOYMENT_URI" --sha256 "$DEPLOYMENT_SHA256" \
            --account-id "$ACCOUNT_ID" --region "$REGION" --repository "$GITHUB_REPOSITORY" --output .deployment
          jq -r 'to_entries[] | "\(.key)=\(.value)"' .deployment/binding.json >> "$GITHUB_OUTPUT"
        env:
          ACCOUNT_ID: ${{ steps.bootstrap.outputs.account_id }}
          REGION: ${{ vars.AMI_REGION }}
          DEPLOYMENT_URI: ${{ needs.prepare.outputs.deployment_uri }}
          DEPLOYMENT_SHA256: ${{ needs.prepare.outputs.deployment_sha256 }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.prepare.outputs.build_id }}-build
          path: artifacts/${{ needs.prepare.outputs.build_id }}
      - run: |
          args=(--deployment .deployment/deployment.json --result "artifacts/$BUILD_ID/image-result.json" --build-id "$BUILD_ID" --execute --output "artifacts/$BUILD_ID/probe")
          test "$BUILD_ID" = "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${BUILD_ID##*-}"
          python3 scripts/probe-ami.py "${args[@]}"
        env:
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.prepare.outputs.build_id }}-probe
          path: artifacts/${{ needs.prepare.outputs.build_id }}/probe/probe.json
          retention-days: 14
          if-no-files-found: warn

  smoke-a:
    name: one / smoke-a
    if: startsWith(needs.prepare.outputs.build_id, format('{0}-{1}-', github.run_id, github.run_attempt))
    needs:
      - prepare
      - probe
    runs-on:
      - runs-on=${{ needs.prepare.outputs.build_id }}-a
      - family=${{ needs.prepare.outputs.instance_type }}
      - cpu=${{ needs.prepare.outputs.vcpus }}
      - ami=${{ needs.prepare.outputs.ami_id }}
      - spot=false
      - retry=false
      - env=${{ needs.prepare.outputs.runs_on_environment }}
      - region=${{ needs.prepare.outputs.region }}
      - private=${{ needs.prepare.outputs.private }}
      - volume=${{ needs.prepare.outputs.root_volume_gib }}gb:gp3:125mbs:3000iops
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      EXPECTED_KERNEL_RELEASE: ${{ needs.prepare.outputs.kernel_release }}
      EXPECTED_RECIPE_ID: ${{ needs.prepare.outputs.recipe_id }}
      BUILD_ID: ${{ needs.prepare.outputs.build_id }}
      SMOKE_STAGE: a
    steps:
      - name: Grant the runner access to Cobalt memory devices
        run: |
          test "$(id -u)" -ne 0
          [[ " $(id -G) " == *" 4242 "* ]]
          prlimit --pid "$$" --memlock --rtprio
          devices=(/dev/rtdm/memdev-private /dev/rtdm/memdev-shared)
          for device in "${devices[@]}"; do
            [[ -c "$device" && ! -L "$device" ]]
          done
          sudo chgrp xenomai "${devices[@]}"
          sudo chmod 0660 "${devices[@]}"
          stat -c '%n %U:%G %a' "${devices[@]}"
      - name: Check running Cobalt kernel and fresh image before checkout
        run: |
          mkdir -p "$RUNNER_TEMP/ami-example-smoke"
          ami-example-guest-report --release "$EXPECTED_KERNEL_RELEASE" --recipe "$EXPECTED_RECIPE_ID" \
            --build-id "$BUILD_ID" --stage "$SMOKE_STAGE" --output "$RUNNER_TEMP/ami-example-smoke/identity.json"
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Activate image environment for subsequent steps
        run: |
          python3 images/common/runner-image-env --format env >> "$GITHUB_ENV"
          python3 images/common/runner-image-env --format json | jq -r '.path[]' >> "$GITHUB_PATH"
      - run: |
          bash images/xenomai-cobalt/smoke.sh test --release "$EXPECTED_KERNEL_RELEASE" --recipe "$EXPECTED_RECIPE_ID" \
            --build-id "$BUILD_ID" --stage "$SMOKE_STAGE" --output "$RUNNER_TEMP/ami-example-smoke" \
            --source "$GITHUB_WORKSPACE/tests/cobalt" --xenomai-root "$XENOMAI_ROOT"
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.prepare.outputs.build_id }}-smoke-a
          path: ${{ runner.temp }}/ami-example-smoke
          retention-days: 14
          if-no-files-found: error

  smoke-b:
    name: one / smoke-b
    if: startsWith(needs.prepare.outputs.build_id, format('{0}-{1}-', github.run_id, github.run_attempt))
    needs:
      - prepare
      - probe
      - smoke-a
    runs-on:
      - runs-on=${{ needs.prepare.outputs.build_id }}-b
      - family=${{ needs.prepare.outputs.instance_type }}
      - cpu=${{ needs.prepare.outputs.vcpus }}
      - ami=${{ needs.prepare.outputs.ami_id }}
      - spot=false
      - retry=false
      - env=${{ needs.prepare.outputs.runs_on_environment }}
      - region=${{ needs.prepare.outputs.region }}
      - private=${{ needs.prepare.outputs.private }}
      - volume=${{ needs.prepare.outputs.root_volume_gib }}gb:gp3:125mbs:3000iops
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      EXPECTED_KERNEL_RELEASE: ${{ needs.prepare.outputs.kernel_release }}
      EXPECTED_RECIPE_ID: ${{ needs.prepare.outputs.recipe_id }}
      BUILD_ID: ${{ needs.prepare.outputs.build_id }}
      SMOKE_STAGE: b
    steps:
      - name: Grant the runner access to Cobalt memory devices
        run: |
          test "$(id -u)" -ne 0
          [[ " $(id -G) " == *" 4242 "* ]]
          prlimit --pid "$$" --memlock --rtprio
          devices=(/dev/rtdm/memdev-private /dev/rtdm/memdev-shared)
          for device in "${devices[@]}"; do
            [[ -c "$device" && ! -L "$device" ]]
          done
          sudo chgrp xenomai "${devices[@]}"
          sudo chmod 0660 "${devices[@]}"
          stat -c '%n %U:%G %a' "${devices[@]}"
      - name: Check running Cobalt kernel and absence of job A sentinel
        run: |
          mkdir -p "$RUNNER_TEMP/ami-example-smoke"
          ami-example-guest-report --release "$EXPECTED_KERNEL_RELEASE" --recipe "$EXPECTED_RECIPE_ID" \
            --build-id "$BUILD_ID" --stage "$SMOKE_STAGE" --output "$RUNNER_TEMP/ami-example-smoke/identity.json"
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Activate image environment for subsequent steps
        run: |
          python3 images/common/runner-image-env --format env >> "$GITHUB_ENV"
          python3 images/common/runner-image-env --format json | jq -r '.path[]' >> "$GITHUB_PATH"
      - run: |
          bash images/xenomai-cobalt/smoke.sh test --release "$EXPECTED_KERNEL_RELEASE" --recipe "$EXPECTED_RECIPE_ID" \
            --build-id "$BUILD_ID" --stage "$SMOKE_STAGE" --output "$RUNNER_TEMP/ami-example-smoke" \
            --source "$GITHUB_WORKSPACE/tests/cobalt" --xenomai-root "$XENOMAI_ROOT"
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.prepare.outputs.build_id }}-smoke-b
          path: ${{ runner.temp }}/ami-example-smoke
          retention-days: 14
          if-no-files-found: error

  watchdog:
    name: one / watchdog
    needs: prepare
    runs-on: ubuntu-24.04
    environment: ${{ vars.AMI_DEPLOYMENT_ENVIRONMENT || 'ami-build' }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          python3 scripts/install-tools.py --group cloud
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
          echo "PACKER_PLUGIN_PATH=$GITHUB_WORKSPACE/.tools/plugins" >> "$GITHUB_ENV"
      - id: bootstrap
        name: Resolve bootstrap identity
        run: |
          test -n "$ROLE_ARN" && test -n "$REGION"
          [[ "$STATE_URI" == s3://*/* ]]
          account_id="$(cut -d: -f5 <<< "$ROLE_ARN")"
          [[ "$account_id" =~ ^[0-9]{12}$ ]]
          state_path="${STATE_URI#s3://}"
          bucket="${state_path%%/*}"
          mkdir -p .execution
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg account_id "$account_id" \
            --arg region "$REGION" --arg artifact_bucket "$bucket" \
            '{repository:$repository,account_id:$account_id,region:$region,artifact_bucket:$artifact_bucket}' \
            > .execution/cleanup-context.json
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"
        env:
          ROLE_ARN: ${{ vars.AMI_CONTROLLER_ROLE_ARN }}
          REGION: ${{ vars.AMI_REGION }}
          STATE_URI: ${{ vars.AMI_STATE_URI }}
      - id: auth
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-session-name: ami-example-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ vars.AMI_CONTROLLER_ROLE_ARN }}
          aws-region: ${{ vars.AMI_REGION }}
          allowed-account-ids: ${{ steps.bootstrap.outputs.account_id }}
          role-duration-seconds: 7200
      - id: execution
        name: Fetch the frozen execution
        run: |
          python3 scripts/deployment-state.py download --cleanup-context .execution/cleanup-context.json \
            --uri "$EXECUTION_URI" --sha256 "$EXECUTION_SHA256" --output .execution/record.json
          test "$(jq -r .run_id .execution/record.json)" = "$GITHUB_RUN_ID"
          test "$(jq -r .run_attempt .execution/record.json)" = "$GITHUB_RUN_ATTEMPT"
        env:
          EXECUTION_URI: ${{ needs.prepare.outputs.execution_uri }}
          EXECUTION_SHA256: ${{ needs.prepare.outputs.execution_sha256 }}
      - id: monitor
        run: python3 scripts/watchdog.py monitor --record .execution/record.json --output artifacts/watchdog
        env:
          GH_TOKEN: ${{ github.token }}
      - if: failure()
        run: |
          if [[ ! -f artifacts/watchdog/watchdog.json ]] || ! jq -e '.status == "upstream_failed"' artifacts/watchdog/watchdog.json; then
            python3 scripts/github-api.py cancel --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  finalize:
    name: one / finalize
    if: always() && needs.prepare.result == 'success'
    needs:
      - prepare
      - probe
      - smoke-a
      - smoke-b
      - watchdog
    runs-on: ubuntu-24.04
    environment: ${{ vars.AMI_DEPLOYMENT_ENVIRONMENT || 'ami-build' }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - id: scope
        run: test "$BUILD_ID" = "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${BUILD_ID##*-}"
        env:
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          python3 scripts/install-tools.py --group cloud
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
          echo "PACKER_PLUGIN_PATH=$GITHUB_WORKSPACE/.tools/plugins" >> "$GITHUB_ENV"
      - id: bootstrap
        name: Resolve bootstrap identity
        run: |
          test -n "$ROLE_ARN" && test -n "$REGION"
          [[ "$STATE_URI" == s3://*/* ]]
          account_id="$(cut -d: -f5 <<< "$ROLE_ARN")"
          [[ "$account_id" =~ ^[0-9]{12}$ ]]
          state_path="${STATE_URI#s3://}"
          bucket="${state_path%%/*}"
          mkdir -p .execution
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg account_id "$account_id" \
            --arg region "$REGION" --arg artifact_bucket "$bucket" \
            '{repository:$repository,account_id:$account_id,region:$region,artifact_bucket:$artifact_bucket}' \
            > .execution/cleanup-context.json
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"
        env:
          ROLE_ARN: ${{ vars.AMI_CONTROLLER_ROLE_ARN }}
          REGION: ${{ vars.AMI_REGION }}
          STATE_URI: ${{ vars.AMI_STATE_URI }}
      - id: auth
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-session-name: ami-example-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ vars.AMI_CONTROLLER_ROLE_ARN }}
          aws-region: ${{ vars.AMI_REGION }}
          allowed-account-ids: ${{ steps.bootstrap.outputs.account_id }}
      - id: execution
        name: Fetch the frozen execution
        run: |
          python3 scripts/deployment-state.py download --cleanup-context .execution/cleanup-context.json \
            --uri "$EXECUTION_URI" --sha256 "$EXECUTION_SHA256" --output .execution/record.json
          test "$(jq -r .run_id .execution/record.json)" = "$GITHUB_RUN_ID"
          test "$(jq -r .run_attempt .execution/record.json)" = "$GITHUB_RUN_ATTEMPT"
        env:
          EXECUTION_URI: ${{ needs.prepare.outputs.execution_uri }}
          EXECUTION_SHA256: ${{ needs.prepare.outputs.execution_sha256 }}
      - id: deployment
        name: Fetch the immutable deployment bundle
        run: |
          python3 scripts/deployment-state.py fetch --uri "$DEPLOYMENT_URI" --sha256 "$DEPLOYMENT_SHA256" \
            --account-id "$ACCOUNT_ID" --region "$REGION" --repository "$GITHUB_REPOSITORY" --output .deployment
          jq -r 'to_entries[] | "\(.key)=\(.value)"' .deployment/binding.json >> "$GITHUB_OUTPUT"
        env:
          ACCOUNT_ID: ${{ steps.bootstrap.outputs.account_id }}
          REGION: ${{ vars.AMI_REGION }}
          DEPLOYMENT_URI: ${{ needs.prepare.outputs.deployment_uri }}
          DEPLOYMENT_SHA256: ${{ needs.prepare.outputs.deployment_sha256 }}
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: ${{ needs.prepare.outputs.build_id }}-*
          path: artifacts/handoff
        continue-on-error: true
      - run: |
          mkdir -p "artifacts/final/$BUILD_ID"
          if [[ "$VARIANT" == stock ]]; then
            cp "artifacts/handoff/$BUILD_ID-build/stock-result.json" "artifacts/final/$BUILD_ID/stock-result.json"
            jq -e '.status == "passed"' "artifacts/final/$BUILD_ID/stock-result.json"
          else
            cp "artifacts/handoff/$BUILD_ID-build/image-result.json" "artifacts/final/$BUILD_ID/image-result.json"
          fi
        env:
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
          VARIANT: one
      - if: needs.smoke-a.result == 'success' && needs.smoke-b.result == 'success' && needs.watchdog.result == 'success'
        run: |
          python3 scripts/github-api.py jobs --record .execution/record.json --output .execution/jobs.json
          python3 scripts/verify-run-results.py --deployment .deployment/deployment.json \
            --result "artifacts/final/$BUILD_ID/image-result.json" --probe "artifacts/handoff/$BUILD_ID-probe/probe.json" \
            --smoke-a "artifacts/handoff/$BUILD_ID-smoke-a" --smoke-b "artifacts/handoff/$BUILD_ID-smoke-b" \
            --instance-a "$(jq -er '."smoke-a".instance_id' .execution/jobs.json)" \
            --instance-b "$(jq -er '."smoke-b".instance_id' .execution/jobs.json)"
        env:
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
          GH_TOKEN: ${{ github.token }}
      - if: always() && steps.scope.outcome == 'success' && steps.auth.outcome == 'success'
        run: |
          python3 scripts/cleanup.py --cleanup-context .execution/cleanup-context.json \
            --build-id "$BUILD_ID" --apply --output "artifacts/final/$BUILD_ID/cleanup"
        env:
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
      - if: always() && steps.scope.outcome == 'success' && steps.auth.outcome == 'success'
        run: |
          python3 scripts/finalize-image.py --deployment .deployment/deployment.json \
            --build-id "$BUILD_ID" --result "artifacts/final/$BUILD_ID/image-result.json" \
            --cleanup "artifacts/final/$BUILD_ID/cleanup/cleanup-report.json" --output "artifacts/final/$BUILD_ID/image-result.json"
        env:
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
      - if: always() && steps.scope.outcome == 'success' && steps.auth.outcome == 'success'
        run: test "$WATCHDOG_RESULT" = success
        env:
          WATCHDOG_RESULT: ${{ needs.watchdog.result }}
      - if: always() && steps.scope.outcome == 'success' && steps.auth.outcome == 'success'
        run: |
          python3 scripts/retain-artifacts.py --cleanup-context .execution/cleanup-context.json \
            --directory "artifacts/final/$BUILD_ID" --prefix "$BUILD_ID/final" --output "artifacts/final/$BUILD_ID/artifact-index.json"
        env:
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
      - if: always() && steps.scope.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.prepare.outputs.build_id }}-final
          path: |-
            artifacts/final/${{ needs.prepare.outputs.build_id }}/image-result.json
            artifacts/final/${{ needs.prepare.outputs.build_id }}/stock-result.json
          retention-days: 14
          if-no-files-found: error

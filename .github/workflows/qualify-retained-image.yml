name: Qualify retained Cobalt image

on:
  workflow_dispatch:
    inputs:
      candidate_result_uri:
        description: Immutable versioned S3 URI of the retained candidate result
        type: string
        required: true

permissions:
  contents: read

env:
  BUILD_VARIANT: one

concurrency:
  group: retained-ami-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-24.04
    outputs:
      build_id: ${{ steps.config.outputs.build_id }}
      region: ${{ steps.config.outputs.region }}
      role_arn: ${{ steps.config.outputs.role_arn }}
      environment: ${{ steps.config.outputs.environment }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: config
        run: python3 scripts/workflow.py qualification-config
        env:
          CLOUD_ENABLED: ${{ vars.AMI_EXAMPLE_CLOUD_ENABLED }}

  prepare:
    name: one / configure
    needs: configure
    runs-on: ubuntu-24.04
    environment: ${{ needs.configure.outputs.environment }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      ami_id: ${{ steps.prepare.outputs.ami_id }}
      recipe_id: ${{ steps.prepare.outputs.recipe_id }}
      kernel_release: ${{ steps.prepare.outputs.kernel_release }}
      label_a: ${{ steps.prepare.outputs.label_a }}
      label_b: ${{ steps.prepare.outputs.label_b }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/install-tools.py --group cloud
      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-session-name: ami-example-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ needs.configure.outputs.role_arn }}
          aws-region: ${{ needs.configure.outputs.region }}
      - id: prepare
        run: python3 scripts/workflow.py qualification-prepare
        env:
          CANDIDATE_RESULT_URI: ${{ inputs.candidate_result_uri }}
          CONFIGURED_BUILD_ID: ${{ needs.configure.outputs.build_id }}
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.configure.outputs.build_id }}-build
          path: |
            artifacts/${{ needs.configure.outputs.build_id }}
            !artifacts/**/inputs.tar
          retention-days: 14
          if-no-files-found: warn

  probe:
    name: one / probe
    needs: [configure, prepare]
    runs-on: ubuntu-24.04
    environment: ${{ needs.configure.outputs.environment }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.configure.outputs.build_id }}-build
          path: artifacts/${{ needs.configure.outputs.build_id }}
      - run: python3 scripts/install-tools.py --group cloud
      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-session-name: ami-example-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ needs.configure.outputs.role_arn }}
          aws-region: ${{ needs.configure.outputs.region }}
      - run: python3 scripts/workflow.py probe
        env:
          BUILD_ID: ${{ needs.configure.outputs.build_id }}
          FAULT: none
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.configure.outputs.build_id }}-probe
          path: artifacts/${{ needs.configure.outputs.build_id }}/probe
          retention-days: 14
          if-no-files-found: warn

  smoke-a:
    name: one / smoke-a
    needs: [configure, prepare, probe]
    runs-on: ${{ needs.prepare.outputs.label_a }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      EXPECTED_KERNEL_RELEASE: ${{ needs.prepare.outputs.kernel_release }}
      EXPECTED_RECIPE_ID: ${{ needs.prepare.outputs.recipe_id }}
      BUILD_ID: ${{ needs.configure.outputs.build_id }}
      SMOKE_STAGE: a
    steps:
      - name: Grant the runner access to Cobalt memory devices
        run: |
          test "$(id -u)" -ne 0
          [[ " $(id -G) " == *" 4242 "* ]]
          prlimit --pid "$$" --memlock --rtprio
          devices=(/dev/rtdm/memdev-private /dev/rtdm/memdev-shared)
          for device in "${devices[@]}"; do
            [[ -c "$device" && ! -L "$device" ]]
          done
          sudo chgrp xenomai "${devices[@]}"
          sudo chmod 0660 "${devices[@]}"
          stat -c '%n %U:%G %a' "${devices[@]}"
      - name: Check running Cobalt kernel and fresh image before checkout
        run: ami-example-smoke identity
      - name: Activate image environment for subsequent steps
        run: runner-image-env --github
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: ami-example-smoke test
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.configure.outputs.build_id }}-smoke-a
          path: ${{ runner.temp }}/ami-example-smoke
          retention-days: 14
          if-no-files-found: error

  smoke-b:
    name: one / smoke-b
    needs: [configure, prepare, probe, smoke-a]
    runs-on: ${{ needs.prepare.outputs.label_b }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      EXPECTED_KERNEL_RELEASE: ${{ needs.prepare.outputs.kernel_release }}
      EXPECTED_RECIPE_ID: ${{ needs.prepare.outputs.recipe_id }}
      BUILD_ID: ${{ needs.configure.outputs.build_id }}
      SMOKE_STAGE: b
    steps:
      - name: Grant the runner access to Cobalt memory devices
        run: |
          test "$(id -u)" -ne 0
          [[ " $(id -G) " == *" 4242 "* ]]
          prlimit --pid "$$" --memlock --rtprio
          devices=(/dev/rtdm/memdev-private /dev/rtdm/memdev-shared)
          for device in "${devices[@]}"; do
            [[ -c "$device" && ! -L "$device" ]]
          done
          sudo chgrp xenomai "${devices[@]}"
          sudo chmod 0660 "${devices[@]}"
          stat -c '%n %U:%G %a' "${devices[@]}"
      - name: Check running Cobalt kernel and absence of job A sentinel
        run: ami-example-smoke identity
      - name: Activate image environment for subsequent steps
        run: runner-image-env --github
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: ami-example-smoke test
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.configure.outputs.build_id }}-smoke-b
          path: ${{ runner.temp }}/ami-example-smoke
          retention-days: 14
          if-no-files-found: error

  watchdog:
    name: one / watchdog
    needs: [configure, prepare]
    runs-on: ubuntu-24.04
    environment: ${{ needs.configure.outputs.environment }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.configure.outputs.build_id }}-build
          path: artifacts/${{ needs.configure.outputs.build_id }}
      - run: python3 scripts/install-tools.py --group cloud
      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-session-name: ami-example-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ needs.configure.outputs.role_arn }}
          aws-region: ${{ needs.configure.outputs.region }}
          role-duration-seconds: 7200
      - run: python3 scripts/watchdog.py --variant one --result "artifacts/$BUILD_ID/image-result.json"
        env:
          BUILD_ID: ${{ needs.configure.outputs.build_id }}
          GH_TOKEN: ${{ github.token }}
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.configure.outputs.build_id }}-watchdog
          path: artifacts/watchdog
          retention-days: 14
          if-no-files-found: warn

  finalize:
    name: one / finalize
    if: always() && needs.prepare.result == 'success'
    needs: [configure, prepare, probe, smoke-a, smoke-b, watchdog]
    runs-on: ubuntu-24.04
    environment: ${{ needs.configure.outputs.environment }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        continue-on-error: true
        with:
          pattern: ${{ needs.configure.outputs.build_id }}-*
          path: artifacts/handoff
      - run: python3 scripts/install-tools.py --group cloud
      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-session-name: ami-example-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ needs.configure.outputs.role_arn }}
          aws-region: ${{ needs.configure.outputs.region }}
      - run: python3 scripts/workflow.py finalize
        env:
          GH_TOKEN: ${{ github.token }}
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.configure.outputs.build_id }}-final
          path: artifacts/final/${{ needs.configure.outputs.build_id }}
          retention-days: 14
          if-no-files-found: error

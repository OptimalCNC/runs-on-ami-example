name: Build and test Cobalt AMIs

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Stock management, one qualified Cobalt image, or two-build reproducibility
        type: choice
        options: [stock, single, qualification]
        default: stock
      retain:
        description: Retain candidates until the configured expiry for debugging
        type: boolean
        default: false
      fault:
        description: Optional controlled probe failure for cleanup qualification
        type: choice
        options: [none, probe-identity]
        default: none

permissions:
  contents: read

# Independent dispatches may overlap; none automatically cancels an older build.
concurrency:
  group: custom-ami-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.configure.outputs.matrix }}
      region: ${{ steps.configure.outputs.region }}
      role_arn: ${{ steps.configure.outputs.role_arn }}
      environment: ${{ steps.configure.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/validate-inputs.py --deployment infra/deployment.json
      - id: configure
        run: python3 scripts/workflow.py configure
        env:
          CLOUD_ENABLED: ${{ vars.AMI_EXAMPLE_CLOUD_ENABLED }}
          BUILD_STAGE: ${{ inputs.stage }}
          FAULT: ${{ inputs.fault }}

  preflight:
    needs: prepare
    runs-on: ubuntu-24.04
    environment: ${{ needs.prepare.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/install-tools.py --group cloud
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-session-name: ami-example-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ needs.prepare.outputs.role_arn }}
          aws-region: ${{ needs.prepare.outputs.region }}
      - run: python3 scripts/preflight.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/preflight.json
          if-no-files-found: warn

  qualify:
    needs: [prepare, preflight]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        variant: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
      actions: write
    uses: ./.github/workflows/qualify-image.yml
    with:
      variant: ${{ matrix.variant }}
      retain: ${{ inputs.retain }}
      fault: ${{ inputs.fault }}

  compare:
    if: inputs.stage == 'qualification'
    needs: [prepare, qualify]
    runs-on: ubuntu-24.04
    environment: ${{ needs.prepare.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ github.run_id }}-${{ github.run_attempt }}-*-final
          path: artifacts/comparison
      - run: python3 scripts/install-tools.py --group cloud
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-session-name: ami-example-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ needs.prepare.outputs.role_arn }}
          aws-region: ${{ needs.prepare.outputs.region }}
      - run: python3 scripts/workflow.py compare
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproducibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/comparison
          retention-days: 14
          if-no-files-found: error

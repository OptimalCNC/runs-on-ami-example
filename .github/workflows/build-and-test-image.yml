name: Build and test Cobalt AMIs

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Stock management, one qualified Cobalt image, or two-build reproducibility
        type: choice
        options: [stock, single, qualification]
        default: stock
      retain:
        description: Retain candidates until the configured expiry for debugging
        type: boolean
        default: false
      fault:
        description: Optional controlled probe failure for cleanup qualification
        type: choice
        options: [none, probe-identity]
        default: none

permissions:
  contents: read

# Independent dispatches may overlap; none automatically cancels an older build.
concurrency:
  group: custom-ami-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  prepare:
    if: vars.AMI_EXAMPLE_CLOUD_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.configure.outputs.matrix }}
      region: ${{ steps.configure.outputs.region }}
      role_arn: ${{ steps.configure.outputs.role_arn }}
      environment: ${{ steps.configure.outputs.environment }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/validate-inputs.py --deployment infra/deployment.json
      - id: configure
        run: |
          python3 scripts/image-config.py --output artifacts/config.json
          jq -r 'to_entries[] | "\(.key)=\(.value)"' artifacts/config.json >> "$GITHUB_OUTPUT"
          test "$(jq -r .repository infra/deployment.json)" = "$GITHUB_REPOSITORY"
          case "$BUILD_STAGE:$FAULT" in
            stock:*) matrix='["stock"]' ;;
            single:*|*:probe-identity) matrix='["one"]' ;;
            *) matrix='["one","two"]' ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
        env:
          BUILD_STAGE: ${{ inputs.stage }}
          FAULT: ${{ inputs.fault }}

  preflight:
    needs: prepare
    runs-on: ubuntu-24.04
    environment: ${{ needs.prepare.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          python3 scripts/install-tools.py --group cloud
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
          echo "PACKER_PLUGIN_PATH=$GITHUB_WORKSPACE/.tools/plugins" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-session-name: ami-example-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ needs.prepare.outputs.role_arn }}
          aws-region: ${{ needs.prepare.outputs.region }}
      - run: python3 scripts/preflight.py
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/preflight.json
          if-no-files-found: warn

  qualify:
    needs: [prepare, preflight]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        variant: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
      actions: write
    uses: ./.github/workflows/qualify-image.yml
    with:
      variant: ${{ matrix.variant }}
      job_prefix: "qualify (${{ matrix.variant }}) / "
      retain: ${{ inputs.retain }}
      fault: ${{ inputs.fault }}

  compare:
    if: inputs.stage == 'qualification'
    needs: [prepare, qualify]
    runs-on: ubuntu-24.04
    environment: ${{ needs.prepare.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: ${{ github.run_id }}-${{ github.run_attempt }}-*-final
          path: artifacts/comparison
      - run: |
          python3 scripts/install-tools.py --group cloud
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
          echo "PACKER_PLUGIN_PATH=$GITHUB_WORKSPACE/.tools/plugins" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-session-name: ami-example-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ needs.prepare.outputs.role_arn }}
          aws-region: ${{ needs.prepare.outputs.region }}
      - run: |
          python3 scripts/compare-builds.py \
            "artifacts/comparison/$RUN_ID-$ATTEMPT-one-final/image-result.json" \
            "artifacts/comparison/$RUN_ID-$ATTEMPT-two-final/image-result.json" \
            --output artifacts/comparison/reproducibility.json
        env:
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
      - if: always()
        run: python3 scripts/retain-artifacts.py --directory artifacts/comparison --prefix "comparisons/$RUN_ID-$ATTEMPT"
        env:
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reproducibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/comparison
          retention-days: 14
          if-no-files-found: error

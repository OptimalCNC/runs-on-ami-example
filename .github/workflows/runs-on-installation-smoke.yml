name: Check RunsOn installation

on:
  workflow_dispatch:
    inputs:
      environment:
        description: RunsOn environment to check
        required: false
        default: production
        type: string

permissions: {}

jobs:
  smoke:
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}/cpu=2/family=t3.nano/env=${{ inputs.environment || 'production' }}/spot=lowest-price
    timeout-minutes: 10
    steps:
      - name: Verify the registered EC2 runner
        shell: bash
        run: |
          set -euo pipefail
          printf '### RunsOn installation smoke check\n\n~~~text\n' >> "$GITHUB_STEP_SUMMARY"
          trap 'result=$?; printf "\n~~~\n\nCheck exit code: %s\n" "$result" >> "$GITHUB_STEP_SUMMARY"' EXIT
          {
            test "$RUNNER_OS" = Linux
            test "$RUNNER_ARCH" = X64
            cpus=$(nproc)
            printf 'Available CPUs: %s\n' "$cpus"
            test "$cpus" -eq 2
            token=$(curl --fail --silent --show-error --max-time 10 -X PUT \
              -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' \
              http://169.254.169.254/latest/api/token)
            identity=$(curl --fail --silent --show-error --max-time 10 \
              -H "X-aws-ec2-metadata-token: $token" \
              http://169.254.169.254/latest/dynamic/instance-identity/document)
            jq -e '.instanceId | startswith("i-")' <<< "$identity"
            jq '{accountId, region, instanceId, instanceType, imageId}' <<< "$identity"
            uname -sr
            printf 'RunsOn installed, launched an EC2 runner, and executed this job.\n'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

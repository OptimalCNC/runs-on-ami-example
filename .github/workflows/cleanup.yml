name: Clean up custom AMI resources

on:
  workflow_run:
    workflows: [Build and test Cobalt AMIs, Qualify retained Cobalt image, Run Cobalt application]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Clean the latest completed attempt of this run; empty sweeps expired resources
        type: string
        default: ''
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read

concurrency:
  group: ami-example-cleanup
  cancel-in-progress: false

jobs:
  configure:
    if: vars.AMI_EXAMPLE_CLOUD_ENABLED == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    outputs:
      region: ${{ steps.config.outputs.region }}
      role_arn: ${{ steps.config.outputs.role_arn }}
      environment: ${{ steps.config.outputs.environment }}
    steps:
      # Always use the trusted default branch, including after a cancelled run.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: config
        run: |
          python3 scripts/image-config.py --output artifacts/config.json
          jq -r 'to_entries[] | "\(.key)=\(.value)"' artifacts/config.json >> "$GITHUB_OUTPUT"
  cleanup:
    needs: configure
    runs-on: ubuntu-24.04
    environment: ${{ needs.configure.outputs.environment }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - run: |
          python3 scripts/install-tools.py --group cloud
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
          echo "PACKER_PLUGIN_PATH=$GITHUB_WORKSPACE/.tools/plugins" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-session-name: ami-example-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ needs.configure.outputs.role_arn }}
          aws-region: ${{ needs.configure.outputs.region }}
      - id: completed
        if: github.event.workflow_run.id || inputs.run_id
        run: |
          args=(--repository "$GITHUB_REPOSITORY" --run-id "$TARGET_RUN_ID" --output artifacts/completed.json)
          if [[ -n "$TARGET_ATTEMPT" ]]; then args+=(--run-attempt "$TARGET_ATTEMPT"); fi
          python3 scripts/github-api.py completed "${args[@]}"
          jq -r 'to_entries[] | "\(.key)=\(.value)"' artifacts/completed.json >> "$GITHUB_OUTPUT"
        env:
          TARGET_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          TARGET_ATTEMPT: ${{ github.event.workflow_run.run_attempt || '' }}
          GH_TOKEN: ${{ github.token }}
      - if: steps.completed.outcome == 'success'
        run: |
          python3 scripts/watchdog.py recover --repository "$GITHUB_REPOSITORY" --run-id "$TARGET_RUN_ID" \
            --run-attempt "$TARGET_ATTEMPT" --output artifacts/cleanup/recovery
        env:
          TARGET_RUN_ID: ${{ steps.completed.outputs.run_id }}
          TARGET_ATTEMPT: ${{ steps.completed.outputs.run_attempt }}
          GH_TOKEN: ${{ github.token }}
      - if: always() && steps.completed.outcome == 'success'
        run: |
          python3 scripts/cleanup.py --run-id "$TARGET_RUN_ID" --run-attempt "$TARGET_ATTEMPT" \
            --apply --output artifacts/cleanup
        env:
          TARGET_RUN_ID: ${{ steps.completed.outputs.run_id }}
          TARGET_ATTEMPT: ${{ steps.completed.outputs.run_attempt }}
      - if: ${{ !github.event.workflow_run.id && !inputs.run_id }}
        run: python3 scripts/cleanup.py --expired --apply --output artifacts/cleanup
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/cleanup
          retention-days: 14
          if-no-files-found: warn

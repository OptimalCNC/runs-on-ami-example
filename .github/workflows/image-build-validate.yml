name: Build and validate image

on:
  pull_request:
    paths:
      - images/build.py
      - images/validate.py
      - images/contracts.py
      - images/vm.py
      - images/requirements.txt
      - images/common/**
      - images/xenomai-cobalt/**
      - execution/cobalt/**
      - images/install-tools.py
      - .github/workflows/image-build-validate.yml
  workflow_dispatch:
    inputs:
      retain_image:
        description: Retain the built disk as a compressed artifact
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Inspect host resources
        run: |
          mkdir -p images/.local/reports
          {
            uname -a
            lscpu
            free -h
            df --block-size=1 "$GITHUB_WORKSPACE"
          } | tee images/.local/reports/host.log
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf cloud-image-utils xorriso python3-yaml
          python3 images/install-tools.py
          echo "$GITHUB_WORKSPACE/images/.local/tools/bin" >> "$GITHUB_PATH"
          echo "PACKER_PLUGIN_PATH=$GITHUB_WORKSPACE/images/.local/tools/plugins" >> "$GITHUB_ENV"
      - name: Verify KVM acceleration
        run: |
          sudo chmod 0666 /dev/kvm
          python3 - <<'PY' | tee images/.local/reports/kvm.log
          import fcntl
          import os

          descriptor = os.open('/dev/kvm', os.O_RDWR | os.O_CLOEXEC)
          try:
              version = fcntl.ioctl(descriptor, 0xAE00, 0)
          finally:
              os.close(descriptor)
          print(f'KVM API version: {version}')
          if version != 12:
              raise SystemExit('Expected KVM API version 12')
          PY
      - name: Build disk
        working-directory: images
        run: |
          python3 build.py --output .local/build --cpus 4 --memory-mib 8192 \
            2>&1 | tee .local/reports/build-command.log
      - name: Validate the finished disk
        working-directory: images
        run: |
          python3 validate.py --build .local/build/build.yaml --output .local/validation \
            2>&1 | tee .local/reports/validate-command.log
      - name: Collect image reports
        if: always()
        working-directory: images
        run: |
          mkdir -p .local/reports
          df --block-size=1 "$GITHUB_WORKSPACE" > .local/reports/final-disk.log
          for file in \
            .local/build/build.yaml \
            .local/build/image-manifest.json \
            .local/build/parent-inventory.json \
            .local/build/packer.log \
            .local/build/serial.log; do
            if [[ -f "$file" ]]; then
              cp "$file" .local/reports/
            fi
          done
          if [[ -d .local/validation ]]; then
            cp -r .local/validation .local/reports/validation
          fi
      - name: Upload image reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: images/.local/reports/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Compress the built disk
        if: github.event_name == 'workflow_dispatch' && inputs.retain_image
        working-directory: images
        run: |
          tar --sparse --gzip --create --file .local/image.tar.gz \
            --directory .local/build build.yaml disk.raw image-manifest.json
      - name: Upload the built disk
        if: github.event_name == 'workflow_dispatch' && inputs.retain_image
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ github.run_id }}-${{ github.run_attempt }}
          path: images/.local/image.tar.gz
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

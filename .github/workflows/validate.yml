name: Validate repository

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/install-tools.py --group validation
      - run: python3 -m pip install --require-hashes -r requirements-validation.txt
      - run: python3 scripts/validate-local.py --tools

name: Validate repository

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-retention:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: images
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check image retention and recovery
        run: python3 -m unittest discover -s publish/tests -v

  runs-on:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: runs-on
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_wrapper: false
      - name: Run installation tests
        run: python3 -m unittest discover -s tests -v
      - name: Check Terraform configuration and mock tests
        run: |
          for variable in "${!TF_@}"; do unset "$variable"; done
          export TF_IN_AUTOMATION=true
          check_dir=$(mktemp -d)
          trap 'rm -rf "$check_dir"' EXIT
          for component in bootstrap deployment; do
            mkdir "$check_dir/$component"
            cp "$component/"*.tf "$component/.terraform.lock.hcl" "$check_dir/$component/"
            cp -R "$component/tests" "$check_dir/$component/tests"
            terraform -chdir="$check_dir/$component" fmt -check -recursive
            terraform -chdir="$check_dir/$component" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$check_dir/$component" validate
            terraform -chdir="$check_dir/$component" test -no-color
          done

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        uses: raven-actions/actionlint@v2.2.0
        with:
          shellcheck: false
          flags: -config-file=.github/actionlint.yaml

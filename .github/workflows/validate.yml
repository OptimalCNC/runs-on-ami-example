name: Validate repository

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          python3 scripts/install-tools.py --group validation
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
          echo "PACKER_PLUGIN_PATH=$GITHUB_WORKSPACE/.tools/plugins" >> "$GITHUB_ENV"
      - run: python3 -m pip install -r images/requirements.txt -r runs-on/requirements.txt -r execution/requirements.txt
      - run: python3 scripts/validate-local.py --tools
